<title>Cáscara Founders</title>
<style>
/* ============================================================
   CÁSCARA FOUNDERS · app
   La piel es de F3: tinta, papel cálido, etiqueta encajonada, radio 0.
   La respiración es de Cáscara: escala grande, aire, columnas anchas.
   Monocromo. El rojo de F3 está racionado: solo lo frenado y lo vencido.
   ============================================================ */
:root{
  --tinta:#171717; --tinta-deep:#0A0A0C; --tinta-warm:#1A1815;
  --papel:#ECEAE4; --papel2:#FBFAF8; --gris:#6A6A66; --gris2:#8E8B85;
  --tiza:#DBD7D2; --rojo:#FE1414;
  --disp:"Helvetica Now Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --edit:"Redaction 10","Redaction","Exposure","Times New Roman",Times,serif;
  --rail:252px; --gut:56px; --col:1080px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --tinta:#ECEAE4; --tinta-deep:#F7F5F1; --tinta-warm:#E4E1DA;
  --papel:#121211; --papel2:#1A1A18; --gris:#93908A; --gris2:#6E6B66;
  --tiza:#2C2C2A; --rojo:#FF4D4D;
}}
:root[data-theme="dark"]{
  --tinta:#ECEAE4; --tinta-deep:#F7F5F1; --tinta-warm:#E4E1DA;
  --papel:#121211; --papel2:#1A1A18; --gris:#93908A; --gris2:#6E6B66;
  --tiza:#2C2C2A; --rojo:#FF4D4D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--disp);
  font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-feature-settings:"kern" 1}
/* grano finísimo de papel, como en los informes */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.026;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--tinta);outline-offset:3px}
.num{font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.it{font-family:var(--edit);font-style:italic}

/* etiqueta encajonada — el motivo de F3, uno por vista */
.caja{display:inline-block;border:1px solid var(--gris2);padding:6px 13px;
  font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gris)}
.et{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gris)}

/* ---------- riel de navegación (escritorio) ---------- */
.riel{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--tinta-deep);
  color:var(--papel2);display:flex;flex-direction:column;padding:34px 0 26px;z-index:20}
.riel .marca{padding:0 26px 30px;border-bottom:1px solid rgba(236,234,228,.14)}
.riel .marca b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.riel .marca span{display:block;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(236,234,228,.42);margin-top:7px}
.riel nav{display:flex;flex-direction:column;padding-top:8px}
.riel nav button{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:baseline;
  padding:15px 26px;color:rgba(236,234,228,.5);transition:color .12s}
.riel nav button .n{font-size:10.5px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.riel nav button .t{font-size:16px;letter-spacing:-.015em}
.riel nav button:hover{color:var(--papel2)}
.riel nav button[aria-selected="true"]{color:var(--papel2)}
.riel nav button[aria-selected="true"] .t{font-weight:700}
.riel nav button[aria-selected="true"]::before{content:"";position:absolute;left:0;width:3px;
  height:22px;background:var(--papel2);margin-top:2px}
.riel nav button{position:relative}
.riel .pie{margin-top:auto;padding:22px 26px 0;border-top:1px solid rgba(236,234,228,.14)}
.riel .pie .f{font-size:10.5px;letter-spacing:.2em;color:rgba(236,234,228,.42)}
.riel .pie .s{font-family:var(--edit);font-style:italic;font-size:14px;
  color:rgba(236,234,228,.42);margin-top:8px;line-height:1.4}

/* ---------- lienzo ---------- */
main{margin-left:var(--rail);min-height:100%;position:relative;z-index:2}
.hoja{max-width:var(--col);padding:0 var(--gut) 96px}
.encab{padding:56px 0 0;display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
.sello{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris2);
  text-align:right;line-height:1.7;white-space:nowrap}
h1.tit{font-size:clamp(40px,4.4vw,64px);font-weight:800;letter-spacing:-.038em;line-height:1;
  margin:26px 0 0;text-wrap:balance;max-width:22ch}
.entrada{font-size:21px;line-height:1.5;color:var(--gris);max-width:52ch;margin:20px 0 0}

/* banda de cifras: hairlines, sin cajas */
.banda{display:grid;grid-template-columns:repeat(4,1fr);margin-top:46px;
  border-top:1px solid var(--tinta);border-bottom:1px solid var(--tiza)}
.banda > *{padding:22px 26px 20px;border-left:1px solid var(--tiza);text-align:left}
.banda > *:first-child{border-left:0;padding-left:0}
.banda b{display:block;font-size:46px;line-height:.92;font-weight:800;letter-spacing:-.055em;
  font-variant-numeric:tabular-nums}
.banda span{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gris);margin-top:12px}
.banda button:hover b{color:var(--gris)}
.banda b.alerta{color:var(--rojo)}

h2.bl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gris);
  font-weight:400;margin:64px 0 0;padding-bottom:14px;border-bottom:1px solid var(--tinta);
  display:flex;justify-content:space-between;align-items:baseline;gap:16px}
h2.bl em{font-style:italic;font-family:var(--edit);text-transform:none;letter-spacing:0;
  font-size:15px;color:var(--gris2)}

/* ---------- filas de cliente ---------- */
.fila{display:grid;grid-template-columns:34px minmax(0,1fr) 130px 88px 150px 18px;
  gap:24px;align-items:center;width:100%;padding:20px 0;border-bottom:1px solid var(--tiza)}
.fila:hover{background:var(--papel2)}
.fila .idx{font-size:11px;color:var(--gris2);font-variant-numeric:tabular-nums}
.fila .nm{display:block;font-size:23px;font-weight:700;letter-spacing:-.026em;line-height:1.15}
.fila .sub{display:block;font-size:15px;color:var(--gris);margin-top:5px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .dia{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.fila .dia b{font-size:19px;letter-spacing:-.04em;display:block;color:var(--tinta);
  font-variant-numeric:tabular-nums;margin-bottom:3px}
.fila .dia.vencido b{color:var(--rojo)}
.fila .hc{font-size:30px;text-align:right}
.fila .fl{width:9px;height:9px;border-right:1px solid var(--gris2);
  border-top:1px solid var(--gris2);transform:rotate(45deg)}

/* ritmo: tinta, no semáforo. Lleno / hueco / rojo racionado */
.ritmo{display:inline-flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gris);white-space:nowrap}
.ritmo i{width:10px;height:10px;flex:0 0 auto;border:1px solid var(--tinta)}
.ritmo.verde i{background:var(--tinta)}
.ritmo.amarillo i{background:transparent}
.ritmo.rojo{color:var(--rojo)}
.ritmo.rojo i{background:var(--rojo);border-color:var(--rojo)}

/* ---------- detalle ---------- */
.dt{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0 64px;align-items:start}
.dt-l{min-width:0}
.dt h1{font-size:clamp(38px,4.2vw,58px);font-weight:800;letter-spacing:-.04em;line-height:1;
  margin:24px 0 0;text-wrap:balance}
.dt .py{font-size:19px;color:var(--gris);margin:16px 0 0;max-width:46ch}
.dt .sellos{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.bloque{padding:28px 0;border-bottom:1px solid var(--tiza)}
.bloque p{margin:12px 0 0;font-size:20px;line-height:1.5;max-width:56ch}
.bloque .grande{font-size:clamp(24px,2.4vw,32px);font-weight:700;letter-spacing:-.028em;
  line-height:1.22;max-width:26ch;margin-top:14px}

/* lateral del detalle: el handicap y los días */
.aside{position:sticky;top:0;padding-top:120px}
.hcard{border-top:1px solid var(--tinta);padding-top:22px}
.hcard .t{display:flex;align-items:baseline;gap:12px}
.hcard .t b{font-size:66px;line-height:.85}
.hcard .t span{font-size:17px;color:var(--gris)}
.hcard .tr{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin-top:12px}
.ejes{margin-top:26px}
.ej{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;
  padding:11px 0;border-top:1px solid var(--tiza)}
.ej .n{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
.ej.f .n{color:var(--tinta);font-weight:700}
.ej .v{font-size:15px;color:var(--gris);font-variant-numeric:tabular-nums}
.ej .b{grid-column:1/-1;display:flex;gap:3px}
.ej .b i{flex:1;height:6px;background:var(--tiza)}
.ej .b i.on{background:var(--tinta)}

/* promedio de la camada por eje, en la vista del programa */
.ejeprom{display:grid;grid-template-columns:210px 64px minmax(0,1fr);gap:16px;align-items:baseline;
  border-top:1px solid var(--tiza);padding:18px 0}
.ejeprom .n{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta);font-weight:700}
.ejeprom .v{font-size:19px;color:var(--gris)}
.ejeprom .q{font-size:16.5px;color:var(--gris);line-height:1.45}
@media (max-width:720px){
  .ejeprom{grid-template-columns:1fr auto;gap:6px 14px}
  .ejeprom .q{grid-column:1/-1}
}

/* la regla de los 90 días */
.dias{border-top:1px solid var(--tinta);padding-top:22px;margin-top:34px}
.dias .g{display:flex;align-items:baseline;gap:10px}
.dias .g b{font-size:52px;line-height:.9}
.dias .g span{font-size:15px;color:var(--gris)}
.dias .g b.vencido{color:var(--rojo)}
.dias .regla{height:6px;background:var(--tiza);margin-top:16px;position:relative;overflow:hidden}
.dias .regla i{display:block;height:100%;background:var(--tinta)}
.dias .regla i.vencido{background:var(--rojo)}
.dias .marcas{display:flex;justify-content:space-between;margin-top:8px;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris2)}
.dias .nota{font-family:var(--edit);font-style:italic;font-size:14.5px;color:var(--gris);margin-top:14px}

.check{margin:14px 0 0;padding:0;list-style:none}
.check li{display:grid;grid-template-columns:16px 1fr;gap:14px;padding:13px 0;
  border-top:1px solid var(--tiza);font-size:18px;line-height:1.45}
.check li::before{content:"";width:11px;height:11px;border:1px solid var(--gris2);margin-top:7px}
.check li b{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gris2);font-weight:400;margin-bottom:3px}

.boton{display:inline-flex;align-items:center;gap:14px;border:1px solid var(--tinta);
  padding:15px 22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:30px}
.boton:hover{background:var(--tinta);color:var(--papel)}
.boton.tinta{background:var(--tinta);color:var(--papel)}
.boton.tinta:hover{background:transparent;color:var(--tinta)}
.boton .fl{width:8px;height:8px;border-right:1px solid currentColor;border-top:1px solid currentColor;
  transform:rotate(45deg)}

/* ---------- filtros y buscador ---------- */
.barra{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:34px}
.busca{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--tinta);
  flex:1;min-width:240px}
.busca input{flex:1;font:inherit;font-size:20px;border:0;background:none;color:inherit;
  padding:11px 0;min-width:0}
.busca input::placeholder{color:var(--gris2)}
.filtros{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--tiza)}
.filtros button{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:11px 15px;
  color:var(--gris);border-right:1px solid var(--tiza)}
.filtros button:last-child{border-right:0}
.filtros button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}

/* ---------- acordeón ---------- */
.ac{border-bottom:1px solid var(--tiza)}
.ac summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto 20px;
  gap:20px;align-items:baseline;padding:24px 0;cursor:pointer}
.ac summary::-webkit-details-marker{display:none}
.ac summary:hover{background:var(--papel2)}
.ac .an{font-size:11px;color:var(--gris2);font-variant-numeric:tabular-nums}
.ac .at small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gris2);margin-bottom:7px}
.ac .at b{display:block;font-size:24px;font-weight:700;letter-spacing:-.026em;line-height:1.2}
.ac .c{font-size:20px;color:var(--gris);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.04em}
.ac .mas{width:14px;height:14px;position:relative;justify-self:end;margin-top:8px}
.ac .mas::before,.ac .mas::after{content:"";position:absolute;background:var(--gris2)}
.ac .mas::before{left:0;right:0;top:6px;height:1px}
.ac .mas::after{top:0;bottom:0;left:6px;width:1px;transition:transform .16s}
.ac[open] .mas::after{transform:scaleY(0)}
.ac .cuerpo{padding:0 0 30px 64px;max-width:62ch}
.ac .cuerpo p{margin:0 0 14px;font-size:19px;line-height:1.55;color:var(--gris)}
.ac .cuerpo p b{color:var(--tinta)}
.ac .cuerpo ul{margin:12px 0 0;padding-left:20px;color:var(--gris)}
.ac .cuerpo li{margin-bottom:8px;font-size:18px}
.ac .cuerpo .pieza{padding:16px 0;border-top:1px solid var(--tiza)}
.ac .cuerpo .pieza .ph{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.ac .cuerpo .pieza b{font-size:19px;color:var(--tinta);letter-spacing:-.02em}
.ac .cuerpo .pieza p{margin:6px 0 0;font-size:17px}

.est{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:4px 9px;
  border:1px solid currentColor;white-space:nowrap;color:var(--gris)}
.est.falta{color:var(--rojo)}

.duenos{display:grid;grid-template-columns:repeat(3,1fr);gap:0 40px;margin-top:10px}
.duen{border-top:1px solid var(--tinta);padding:20px 0 26px}
.duen .dh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.duen .dh b{font-size:22px;font-weight:700;letter-spacing:-.024em}
.duen .dh span{font-size:24px;color:var(--gris);font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums}
.duen ul{margin:16px 0 0;padding:0;list-style:none}
.duen li{font-size:16px;line-height:1.4;margin-bottom:13px;color:var(--gris)}
.duen li b{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gris2);font-weight:400;margin-bottom:3px}
.duen .mas{font-family:var(--edit);font-style:italic;font-size:14.5px;color:var(--gris2)}

.vacio{padding:60px 0;font-family:var(--edit);font-style:italic;font-size:19px;color:var(--gris2)}
.vista{display:none}.vista.on{display:block}
.topmov{display:none}

/* ================= TABLET ================= */
@media (max-width:1080px){
  :root{--rail:196px;--gut:38px}
  .fila{grid-template-columns:28px minmax(0,1fr) 110px 74px 130px 16px;gap:16px}
  .fila .nm{font-size:21px}
  .dt{grid-template-columns:1fr;gap:0}
  .aside{position:static;padding-top:38px}
  .duenos{grid-template-columns:repeat(2,1fr);gap:0 30px}
}
/* ================= CELULAR ================= */
@media (max-width:720px){
  :root{--gut:20px;--tabh:58px}
  body{font-size:17px}
  .riel{left:0;right:0;top:auto;bottom:0;width:auto;height:calc(var(--tabh) + env(safe-area-inset-bottom,0px));
    padding:0 0 env(safe-area-inset-bottom,0px);flex-direction:row}
  .riel .marca,.riel .pie{display:none}
  .riel nav{flex-direction:row;flex:1;padding:0}
  .riel nav button{flex:1;grid-template-columns:1fr;gap:0;justify-items:center;
    align-content:center;padding:0;height:var(--tabh)}
  .riel nav button .n{display:none}
  .riel nav button .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .riel nav button[aria-selected="true"]::before{left:50%;transform:translateX(-50%);top:0;
    width:26px;height:2px;margin:0}
  main{margin-left:0;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px))}
  .topmov{display:flex;position:sticky;top:0;z-index:15;background:var(--papel);
    border-bottom:1px solid var(--tiza);align-items:center;gap:12px;
    padding:13px var(--gut);min-height:52px}
  .topmov b{font-size:15px;font-weight:800;letter-spacing:-.025em;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topmov .f{font-size:9.5px;letter-spacing:.18em;color:var(--gris2)}
  .topmov .atras{width:34px;height:34px;margin-left:-8px;display:none;align-items:center;
    justify-content:center}
  .topmov .atras i{width:9px;height:9px;border-left:1.5px solid var(--tinta);
    border-bottom:1.5px solid var(--tinta);transform:rotate(45deg);display:block}
  body.detalle .topmov .atras{display:flex}
  .encab{padding-top:30px;flex-direction:column;gap:14px}
  .sello{display:none}
  h1.tit{font-size:clamp(30px,8vw,40px);margin-top:16px}
  .entrada{font-size:17px;margin-top:14px}
  .banda{grid-template-columns:1fr 1fr;margin-top:30px;border-bottom:0}
  .banda > *{padding:18px 0 16px;border-left:0;border-bottom:1px solid var(--tiza)}
  .banda > *:nth-child(even){padding-left:20px;border-left:1px solid var(--tiza)}
  .banda b{font-size:34px}
  h2.bl{margin-top:44px;flex-direction:column;gap:6px;align-items:flex-start}
  .fila{grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:16px 0}
  .fila .idx{display:none}
  .fila .nm{font-size:19px}
  .fila .hc{grid-row:1;grid-column:2;font-size:24px;justify-self:end}
  .fila .sub{grid-column:1/-1}
  .fila .dia{grid-column:1;font-size:9.5px}
  .fila .dia b{display:inline;font-size:14px;margin:0}
  .fila .ritmo{grid-column:2;justify-self:end;font-size:9.5px}
  .fila .fl{display:none}
  .duenos{grid-template-columns:1fr;gap:0}
  .ac summary{grid-template-columns:36px minmax(0,1fr) auto 18px;gap:14px;padding:18px 0}
  .ac .at b{font-size:19px}
  .ac .cuerpo{padding-left:0}
  .ac .cuerpo p,.ac .cuerpo li{font-size:16.5px}
  .bloque p{font-size:17.5px}
  .bloque .grande{font-size:22px}
  .hcard .t b{font-size:52px}
  .dias .g b{font-size:40px}
  .check li{font-size:16.5px}
  .boton{width:100%;justify-content:space-between}
}
@media print{.riel,.topmov,.boton{display:none}main{margin:0}body::before{display:none}}
</style>

<aside class="riel">
  <div class="marca"><b>Cáscara Founders</b><span>Torre de control</span></div>
  <nav role="tablist" aria-label="Secciones"><button role="tab" data-t="hoy" aria-selected="true"><span class="n num">01</span><span class="t">Hoy</span></button><button role="tab" data-t="clientes" aria-selected="false"><span class="n num">02</span><span class="t">Clientes</span></button><button role="tab" data-t="programa" aria-selected="false"><span class="n num">03</span><span class="t">Programa</span></button><button role="tab" data-t="material" aria-selected="false"><span class="n num">04</span><span class="t">Material</span></button></nav>
  <div class="pie"><div class="f">12 SEP 2026</div>
    <div class="s">Se actualiza solo todas las mañanas con lo que salió de las llamadas del día anterior.</div></div>
</aside>

<main>
  <div class="topmov">
    <button class="atras" id="atras" aria-label="Volver"><i></i></button>
    <b id="tmov">Hoy</b><span class="f" id="fmov"></span>

u-bruzzone","t":"Queda abierto el acceso a las llamadas grupales hasta la fecha que fije Teo en el sign-off (falta confirmar)"},{"c":"Matías Morales","slug":"matias-morales","t":"Cáscara le deja la estructura y un ejemplo de cada pieza de la entrega, no los documentos del cliente"},{"c":"Sharon Palacio","slug":"sharon-palacio","t":"Quedan un par de llamadas uno a uno con Facu antes del cierre (falta confirmar cuántas exactamente)"},{"c":"Sharon Palacio","slug":"sharon-palacio","t":"Grupales hasta fin de septiembre, y después acceso abierto como caso de éxito para que los demás se rodeen de lo que viene logrando"},{"c":"Bianca Antonini","slug":"bianca-antonini","t":"Cáscara le configura las automatizaciones de mail con Risen y Claude, segmentadas por nivel de compra"},{"c":"Bianca Antonini","slug":"bianca-antonini","t":"Cáscara le edita los contenidos que grabó en el cowork, de regalo"},{"c":"Lucca Sorgoni","slug":"lucca-sorgoni","t":"Queda abierto el acceso a las llamadas grupales hasta la fecha que fije Teo en el sign-off (falta confirmar)"}]}],"proceso":[{"n":"01","c":"Día 0 · ventana de 48 horas","t":"Onboarding con Teo","x":"Se dispara con la confirmación de pago: contrato, alta, entrega de materiales y recordatorio de formularios a las 48 y 96 horas. Teo crea la ficha en Cuentas, el OS del cliente, el grupo de WhatsApp y el acceso a la app. El founder completa diagnóstico, números, oferta y Founder Insights. Se le explica cómo consumir el programa, el mapa de mentores y el modelo de conducta."},{"n":"02","c":"Semana 1","t":"Las tres grupales y la Clarity Call con Facu","x":"Arranca con la grupal de Teo (bienvenida, setup y calendario), sigue la de Juana (definición de audiencia) y la de Fede (línea editorial y ángulos). Cierra con la Clarity Call de Facu: diagnóstico, cuello de botella y prioridad de ataque. Facu lee antes todos los Founder Insights y formularios. Sin formularios completos no hay Clarity Call: el día 5 escala Teo y el día 7 se corre la llamada. De ahí salen las conclusiones que van a Franco."},{"n":"03","c":"Semana 2","t":"Producto, oferta y lanzamiento con Franco","x":"El founder llega con el formulario de construcción de oferta respondido: 40 preguntas en 8 bloques sobre resultado, paso a paso, módulos, cliente y precio. Sale el one-pager de oferta con el ICP. La arquitectura que se baja es asesoría paga única y diagnóstica que se acredita a la consultoría, la consultoría de 90 días como oferta principal y única pública, y el DFY arriba como upsell. Se valida con precio, nunca gratis."},{"n":"04","c":"Semana 3","t":"Selección de foco con Facu","x":"Se elige una sola orientación con tres preguntas en orden de prioridad: ¿llegan y cierran consultas?, ¿la demanda depende de su energía?, ¿la entrega le come el tiempo? La primera negativa define la ruta y ante empate se va hacia lo más cerca del dinero. La decisión es de Facu."},{"n":"05","c":"Fin del mes 1","t":"Radiografía y roadmap","x":"Se junta todo lo que hubo con esa persona (llamadas, propuestas enviadas, Founder Insights, updates de WhatsApp) y se escribe un solo documento: punto A con hechos, lectura del caso con un único cuello de botella, punto B medible con fecha, qué pasó hasta hoy, qué salió bien y qué no contra la métrica declarada, y el roadmap de 8 semanas de esa orientación con objetivo y entregable por semana. Los compromisos quedan de los dos lados, con fecha y responsabilidad 50/50 explícita. Crear contenido es condición para entrar al mes 2."},{"n":"06","c":"Mes 2 · cuatro sesiones 1:1","t":"El servicio","x":"Cuatro uno a uno alternadas: oferta y pricing con Franco, estructura de entrega con Facu, adquisición y ventas con Franco, y cierre de mes 2 con Facu. Las tres grupales siguen corriendo; lo que termina acá es la presencia de Facu y Franco en grupales, que pasan a atender solo uno a uno."},{"n":"07","c":"Mes 3 · tres sesiones 1:1","t":"El cierre","x":"Apertura del mes 3 con Franco, ejecución sobre el foco con Facu, y cierre, sign-off y roadmap a 6 meses con Teo. En el cierre se suma el paquete de entregables que el founder ejecuta solo y la recomendación: renovar con módulo, pasar a growth partner u offboarding como caso de éxito con testimonio."},{"n":"08","c":"Los 90 días · transversal","t":"Diez uno a uno y trece semanas de grupales","x":"En total son 10 sesiones uno a uno por founder: tres en el mes 1, cuatro en el mes 2 y tres en el mes 3, con tema, fecha y mentor definidos desde el día 1. Cinco de esas diez son de Facu. Las tres grupales corren las trece semanas sin interrupción y hay un encargado del equipo siguiendo la evolución de forma continua. Con 16 cupos son 80 sesiones por camada."}],"orientaciones":[{"n":"Conseguir","l":"Franco","x":"Se trabaja la oferta, el pricing y el proceso de ventas. El resultado a 60 días son los primeros cierres con el sistema nuevo. En el handicap es la ruta que marcan los ejes de Oferta y de Venta cuando alguno de los dos es el más bajo.","m":["Lista de 50 prospectos","Guion de outreach probado","20 conversaciones abiertas","5 propuestas enviadas","Pipeline corriendo"]},{"n":"Sostener","l":"Fede","x":"Se trabaja contenido, audiencia y delegación de la producción. El resultado a 60 días es un ritmo de publicación que se sostiene solo. En el handicap es la ruta que marcan los ejes de Contenido y de Demanda.","m":["Línea editorial escrita","3 ángulos definidos","Calendario de 60 días cargado","4 semanas publicando sin cortar","Primera contratación"]},{"n":"Entregar","l":"Facu","x":"Se trabaja el proceso de servicio, la capacidad y el equipo. El resultado a 60 días es la misma entrega con menos horas propias. En el handicap es la ruta que marca el eje de Entrega.","m":["Mapa de servicio con horas reales","Proceso de entrega documentado","Template de onboarding de cliente","Informes de entrada y de cierre","Primera contratación","Capacidad y precios definidos"]}],"grupales":[{"n":"Operaciones","q":"Teo","c":"Martes 15:00","x":"Sistemas, entrega y herramientas. En la semana 1 es la de bienvenida, setup y calendario. Trece temas rotativos a lo largo de las trece semanas."},{"n":"Creatividad","q":"Juana","c":"Jueves 15:00","x":"Identidad, dirección visual y voz de marca. En la semana 1 se define la audiencia. Trece temas rotativos."},{"n":"Contenido","q":"Fede","c":"Viernes 16:30","x":"Línea editorial, ángulos, formatos y ritmo. Trece temas rotativos. Los viernes hay veinte minutos de coordinación del equipo."},{"n":"Cómo corre cada sesión","q":"Las tres iguales","c":"Las trece semanas, sin interrupción","x":"Abre con el marcador de la sesión anterior y el checklist exigido. Revisa ejecución sobre material real de dos o tres participantes. Enseña el tema de la rotación. Crea algo en vivo en la llamada. Deja inspiración: tres ideas y una referencia. Y cierra con un desafío que ya está en el checklist de la orientación. Hay una sola inscripción por sesión, los mentores leen las inscripciones previas y los conflictos escalan a Facu. Dónde y quién gestiona la inscripción a las grupales (falta confirmar)."}],"mentores":[{"n":"Facu","r":"Estructura y negocio. Toma la Clarity Call, la selección de foco, la estructura de entrega, el cierre de mes 2 y la ejecución sobre el foco: cinco de las diez sesiones.","si":"Procesos, equipo, delegación, management y priorización.","no":"Creatividad y contenido."},{"n":"Franco","r":"Oferta, precio y ventas. Toma producto y oferta en la semana 2, oferta y pricing y adquisición en el mes 2, y la apertura del mes 3.","si":"Growth, monetización, oferta, pricing, ventas y escala.","no":"Detalles de ejecución y herramientas de diseño."},{"n":"Fede","r":"Contenido. Lleva la grupal de contenido y es el dueño de la orientación Sostener junto a la línea editorial y los ángulos.","si":"Narrativa, ángulos, calendario y mensaje.","no":"Pricing y estructura societaria."},{"n":"Juana","r":"Creatividad. Lleva la grupal de creatividad y la definición de audiencia de la semana 1.","si":"Identidad, dirección visual y voz de marca.","no":"Ventas y operaciones."},{"n":"Teo","r":"Operaciones. Toma el onboarding de las primeras 48 horas, la grupal de operaciones y el cierre con sign-off y roadmap a 6 meses.","si":"Sistemas, entrega, herramientas y fulfillment.","no":"Oferta y posicionamiento."}],"bloques":[{"n":"La oferta y lo comercial","piezas":[{"t":"Presentación","q":"La oferta en 16 slides. Es la pieza para presentar el programa en una llamada o para mandar antes de una reunión.","e":"listo","f":["HTML"],"u":"https://facundocouyet.github.io/aceleradora/presentacion.html"},{"t":"Informe completo","q":"El documento maestro: los principios, los cinco frentes, el mapa de mentores, la rotación de 13 semanas, la anatomía de una grupal, la camada 1, el lanzamiento, los checklists por orientación y los puntos abiertos. Manda sobre el resto.","e":"listo","f":["HTML"],"u":"https://facundocouyet.github.io/aceleradora/informe.html"},{"t":"La oferta al cliente","q":"Qué incluye el programa, el roadmap sesión por sesión, las tres orientaciones, los founders, los bonus y la inversión. Se ve en el navegador, se descarga como HTML o se imprime en PDF.","e":"listo","f":["HTML","HTML descargable","PDF"],"u":"https://facundocouyet.github.io/aceleradora/oferta.html"},{"t":"Pitch deck","q":"Figura como sección 03 de la plataforma pero no tiene archivo propio: los botones que están debajo llevan a la oferta al cliente. Hay que definir si es una pieza aparte o si el nombre sobra.","e":"falta escribir","f":[],"u":""},{"t":"Planificador de calendario","q":"Herramienta interactiva para armar el calendario de la camada: 13 alumnos, tres franjas, 13 semanas más las 1:1, con el roadmap desplegable. La usa Teo, no va a diseño.","e":"listo","f":["HTML"],"u":""},{"t":"Tabla de triage de clientes F3","q":"Quién entra a Founders, quién no y a quién se le ofrece un upsell. Está armada como hipótesis y la tiene que corregir Teo.","e":"en borrador","f":["Markdown"],"u":""}]},{"n":"Los documentos de cliente","piezas":[{"t":"Radiografías con roadmap · once clientes","q":"Aaron, Agostina, Bianca, Custom Lab, José David, Lola, Lucio, Matías, Sebastián, Sofía y Sol. Siguen en el programa: septiembre para dejar todo armado, octubre para ver la evolución, cierre el 31 de octubre. Falta revisarlos antes de mandarlos.","e":"en borrador","f":["HTML","PDF"],"u":""},{"t":"Informes de cierre · ocho clientes","q":"Andrea, Antonio, Ayelén, Lucca, Manu, Nicolás, Scarlett y Sharon. Cierra el proceso y deja los próximos sesenta días escritos para que los ejecuten solos. Las llamadas de sign-off las hace Teo. Falta revisarlos antes de mandarlos.","e":"en borrador","f":["HTML","PDF"],"u":""},{"t":"Qualita · Radiografía y roadmap de retoma","q":"Primera corrida de la skill de radiografía. Está entregada y esperando la decisión de Rafa.","e":"listo","f":["Markdown","Canvas"],"u":""},{"t":"Qualita · Roadmap Cáscara Founders","q":"Catorce paneles en el formato oficial de roadmap de cliente. Es la referencia visual para los que vengan.","e":"listo","f":["Canvas"],"u":""},{"t":"Formulario de construcción de oferta","q":"Cuarenta preguntas en ocho bloques: resultado, paso a paso, módulos, cliente y precio. Se le manda al founder antes del 1:1 con Franco. Activo reutilizable para toda la camada.","e":"listo","f":["Markdown"],"u":""},{"t":"Briefing de clarity call","q":"Una carilla antes de la llamada: el problema en una línea, síntoma contra problema real, la métrica del trimestre, los activos y los vacíos, y dos o tres tensiones para abrir. Ya se hizo para Sebastián, beMOTION y Sofía.","e":"listo","f":["Markdown"],"u":""},{"t":"Paquete de entregables de cierre","q":"Lo que el founder se lleva para ejecutar solo. El modelo probado es el de Ceci: auditoría de producto e instrumentación de la plataforma, estructura y copy de landing, calendario de contenido repetible y playbook de outreach en frío con templates.","e":"listo","f":["Markdown"],"u":""},{"t":"Handoff de diseño de la radiografía","q":"El formato con el que se maqueta cada documento: header con la métrica, timeline continuo con las 1:1 y la banda de acompañamiento async, checklist de reuniones, bloque de oferta y pipeline.","e":"listo","f":["Markdown"],"u":""}]},{"n":"Los contratos","piezas":[{"t":"Contrato de Cáscara Founders","q":"No existe. Hoy se firma con el template del programa B2C, prestado. Es el primer pendiente de la lista del informe maestro.","e":"falta escribir","f":[],"u":""},{"t":"Template de contrato B2C","q":"El contrato del programa B2C. Es el que se usa mientras no esté el propio de la aceleradora.","e":"listo","f":[],"u":""},{"t":"Prompt maestro de generación de contratos","q":"Datos de la entidad, el template y un bloque de pedido por propuesta. Genera el contrato a partir de la propuesta comercial.","e":"listo","f":["Markdown"],"u":""},{"t":"Acuerdo de growth partner","q":"El modelo para los casos de nivel 3: rev share sobre profit neto, waterfall de comisiones, costos directos y split. Regla fija: el acuerdo interno y el acuerdo con el cliente van siempre separados.","e":"listo","f":["Markdown","PDF"],"u":""},{"t":"Briefing legal de growth partner","q":"Qué es un growth partner y cómo se calcula el profit, escrito para que lo lea el abogado. Hecho para MySaint y para Daniella Aiello.","e":"listo","f":["PDF"],"u":""},{"t":"Contrato de partnership · Delfina Ferro","q":"Treinta y seis artículos redactados completos, con notas de redacción para legales. Está esperando la revisión legal.","e":"en borrador","f":["Word"],"u":""}]},{"n":"Los procesos internos","piezas":[{"t":"Proceso de consultoría de founders","q":"Cómo se atiende a un founder de punta a punta: el día 0 de onboarding, la cadena de accionables semana por semana, las diez llamadas 1:1, las tres orientaciones, la radiografía, la anatomía de una grupal y la cuenta de capacidad. Es el documento que hay que leer primero.","e":"listo","f":["Markdown"],"u":""},{"t":"Checklists por orientación","q":"Qué tiene que estar hecho en Conseguir, en Sostener y en Entregar, más el piso común a las tres al día 90. Van como anexo del informe maestro.","e":"listo","f":["HTML"],"u":"https://facundocouyet.github.io/aceleradora/informe.html"},{"t":"Mapa de mentores","q":"Qué le lleva el founder a cada uno y qué no. Franco, Facu, Fede, Juana y Teo, con los cinco frentes repartidos.","e":"listo","f":["HTML","Markdown"],"u":""},{"t":"Inventario de producción","q":"Todo lo producido por fecha, título y versión, con dónde vive y en qué estado está. Se le agrega una fila al terminar cualquier entregable.","e":"listo","f":["Markdown"],"u":""},{"t":"Índice del sistema","q":"Qué documento sirve para qué y en qué orden se leen. Las reglas del sistema están acá: un paso abierto por día, cada entregable al inventario con versión, las decisiones de proceso se escriben y no quedan en un chat.","e":"listo","f":["Markdown"],"u":""},{"t":"Repaso de clientes · Teo y Facu","q":"La charla del 2 de septiembre pasada a documento. De ahí salieron los diecinueve documentos de cliente, los módulos por categoría y las decisiones de proceso.","e":"listo","f":["HTML","Notion"],"u":""},{"t":"Roadmap de automatización","q":"Qué se automatiza, con qué herramienta y en qué fase. Es el documento que se lee para elegir el próximo paso.","e":"listo","f":["Markdown"],"u":""},{"t":"Padrón de clientes","q":"El cruce de las dos bases de clientes de Notion: quién tiene ficha, quién está desalineado y qué duplicados hay. Se lee antes de dar una lista de clientes por cerrada.","e":"listo","f":["Markdown","Notion"],"u":""},{"t":"Plantilla de paneles de founders","q":"El generador del formato oficial de paneles, 1920 por 1080, para presentar roadmaps de clientes. Se cambia el contenido, se corre y se publica.","e":"listo","f":["Script","HTML"],"u":""},{"t":"Handoffs de chats y de diseño","q":"Lo que quedó de 137 chats de trabajo y 47 de diseño: qué se produjo, qué se decidió, los números y los pendientes. Se busca acá antes de rehacer algo.","e":"listo","f":["Markdown"],"u":""}]}],"modulos":[{"c":"Comunidad","items":[{"t":"Arquitectura mínima de una comunidad","x":"Lo que hace falta para que una comunidad exista de verdad: llamadas mensuales, un reto por mes, curaduría de recursos, ritual de bienvenida con respuesta a cada presentación y premios por participación.","e":"falta escribir"},{"t":"Comunidad de WhatsApp para marcas de producto","x":"Cómo se llena desde YouTube y redes, y qué dinámicas la mantienen activa una vez que está llena.","e":"falta escribir"},{"t":"Identificación del buyer en la propia comunidad","x":"De la comunidad salen las ofertas siguientes. El módulo enseña a leer quién compra adentro de lo que ya se juntó.","e":"falta escribir"},{"t":"Workshop y bootcamp como activación","x":"Las dos dinámicas que mueven una comunidad quieta y sirven para abrir una venta.","e":"falta escribir"}]},{"c":"Contenido","items":[{"t":"Profile funnel","x":"Descripción, destacadas y contenido anclado trabajando juntos, para que el perfil convierta sin que haya que explicarlo.","e":"falta escribir"},{"t":"Calendario de lanzamiento de 45 días","x":"Quince días de historia para calentar la audiencia, después el problema, después la solución, y recién ahí el lanzamiento.","e":"falta escribir"},{"t":"Templates de estrategia de contenido sin lanzamiento","x":"Para el que no vende nada todavía y solo quiere comunicar: formatos con un ejemplo adentro de cada uno.","e":"falta escribir"},{"t":"Ángulos de comunicación desde el ICP","x":"Cómo bajar los ángulos del cliente ideal, con un guion de ejemplo por ángulo.","e":"falta escribir"}]},{"c":"Oferta","items":[{"t":"ICP del mecanismo","x":"El cliente ideal de lo que se vende, no de la empresa en general. Es la confusión más común y la que rompe el pricing.","e":"falta escribir"},{"t":"One-sheeter de la oferta","x":"Qué resultado entregás y qué paso a paso seguís para entregarlo, en una sola hoja.","e":"falta escribir"},{"t":"Pricing y escalera de valor","x":"Cómo se pone el precio y cómo se ordenan los productos de abajo hacia arriba.","e":"falta escribir"}]},{"c":"Entrega de servicio","items":[{"t":"Onboarding del cliente en 48 horas","x":"Qué pasa en las primeras cuarenta y ocho horas después de que el cliente paga.","e":"falta escribir"},{"t":"Cómo presentar un roadmap al cliente","x":"El founder tiene que poder mostrarle a su propio cliente adónde van y en qué orden.","e":"falta escribir"},{"t":"Entrega que se repite igual cada vez","x":"Cómo se arma un proceso de servicio que no dependa de la memoria del que lo ejecuta.","e":"falta escribir"}]},{"c":"Comercial","items":[{"t":"Contratar un setter y contratar un closer","x":"Cómo se busca, cómo se prueba y cómo se paga cada rol. Lo baja Francisca.","e":"falta escribir"},{"t":"Recontacto sobre la base histórica","x":"Volver a los que ya compraron o casi compraron. Es lo que le funcionó a Custom Lab.","e":"falta escribir"},{"t":"Outbound sobre el pipeline propio","x":"Calendly, llamadas que no cerraron y contactos viejos: plata que ya está en la agenda.","e":"falta escribir"}]},{"c":"Onboarding del programa","items":[{"t":"Pasaporte digital de nivel dos","x":"Para los que entran buscando su diferencial en la comunicación, donde los Founder Insights no alcanzan.","e":"falta escribir"},{"t":"Kick-off grabado de cada grupal","x":"Qué se trabaja, con qué hay que llegar y por dónde empezar. Uno de Teo, uno de Juana y uno de Fede.","e":"falta escribir"},{"t":"Video precall de las grupales","x":"Para que la primera semana rinda en vez de usarse para explicar cómo funciona la llamada.","e":"falta escribir"}]}],"decisiones":[{"t":"El roadmap se ve","x":"El roadmap del servicio tiene que estar a mano y cada cliente tiene que poder ver el suyo. Y cada ficha necesita fecha de inicio: hoy falta en casi todas y sale de los reportes de ventas."},{"t":"El primer mes cierra siempre igual","x":"Oferta construida, ICP identificado, ángulos de comunicación y profile funnel acomodado. Desde function vClientes(){
  var h='<div class="hoja">'+encab('La camada','Los '+C.length+' clientes','',
    'Ordenados por handicap<br>día promedio: '+promDias);
  h+='<div class="barra"><span class="busca"><input id="q" type="search" placeholder="Buscar cliente o proyecto" value="'+esc(busca)+'" aria-label="Buscar"></span><span class="filtros">';
  F.forEach(function(f){h+='<button data-f="'+f[0]+'" aria-pressed="'+((filtro||'todos')===f[0])+'">'+f[1]+'</button>'});
  h+='</span></div><div id="lista" style="margin-top:30px;border-top:1px solid var(--tinta)"></div>'+
     '<p class="vacio" id="vacio" hidden>Nada con ese filtro.</p></div>';
  $('#v-clientes').innerHTML=h;
  $('#q').addEventListener('input',function(){busca=this.value;pinta()});
  $('#v-clientes').querySelectorAll('.filtros button').forEach(function(b){
    b.addEventListener('click',function(){
      filtro=b.dataset.f==='todos'?null:b.dataset.f;
      $('#v-clientes').querySelectorAll('.filtros button').forEach(function(o){o.setAttribute('aria-pressed',String(o===b))});
      pinta();});});
  pinta();
}
function pinta(){
  var t=busca.trim().toLowerCase();
  var l=C.filter(function(c){
    if(filtro==='cierre'&&c.modo!=='cierre')return false;
    if(filtro==='rojo'&&(!c.h||c.h.ri!=='rojo'))return false;
    if(filtro==='vencido'&&!(c.dia&&c.dia>90))return false;
    if(filtro&&['Conseguir','Sostener','Entregar'].indexOf(filtro)>-1&&c.ori!==filtro)return false;
    if(t&&(c.nombre+' '+c.proyecto).toLowerCase().indexOf(t)<0)return false;
    return true;});
  l.sort(function(a,b){return (a.h?a.h.t:99)-(b.h?b.h.t:99)});
  $('#lista').innerHTML=l.map(fila).join('');
  $('#vacio').hidden=l.length>0;
}

    '<div class="sello">'+esc(c.ori)+'<br>'+(c.h?esc(c.h.tr):'')+'</div></div>'+
    '<h1>'+esc(c.nombre)+'</h1><p class="py">'+esc(c.proyecto)+'</p>';
  h+='<div class="bloque"><span class="et">El cuello de botella</span><p class="grande">'+esc(c.cuello)+'</p></div>';

  if(c.cas&&c.cas.length) h+='<div class="bloque"><span class="et">Septiembre · lo hace Cáscara</span><ul class="check">'+
    c.cas.map(function(x){return '<li><span>'+esc(x)+'</span></li>'}).join('')+'</ul></div>';
  if(c.abierto) h+='<div class="bloque"><span class="et">Sin definir</span><p>'+esc(c.abierto)+'</p></div>';
  if(c.doc) h+='<a class="boton tinta" href="clientes/'+esc(c.doc)+'">Abrir el documento completo<span class="fl"></span></a>';
  h+='<p class="vacio" style="padding:26px 0 0;font-size:15px">Última llamada tomada: '+esc(c.ultima)+'</p>';
  h+='</div><aside class="aside">';
  if(c.h){
    h+='<div class="hcard"><span class="et">Handicap</span><div class="t"><b class="num">'+c.h.t+'</b><span>de 20</span></div>'+
      '<div class="tr">'+esc(c.h.tr)+' · '+esc(c.h.rt)+'</div><div class="ejes">';
    for(var i=0;i<5;i++){
      var b=''; for(var j=0;j<4;j++) b+='<i class="'+(j<c.h.ej[i]?'on':'')+'"></i>';
      h+='<div class="ej'+(c.h.flo.indexOf(i)>-1?' f':'')+'"><span class="n">'+esc(D.ejes[i])+'</span>'+
         '<span class="v">'+c.h.ej[i]+'</span><span class="b">'+b+'</span></div>';}
    h+='</div></div>';
  }
  h+='<div class="dias"><span class="et">Con nosotros</span><div class="g"><b class="num'+(venc?' vencido':'')+'">'+
     (c.dia||'—')+'</b><span>'+(c.dia?'días':'sin fecha cargada')+'</span></div>'+
     '<div class="regla"><i class="'+(venc?'vencido':'')+'" style="width:'+pct+'%"></i></div>'+
     '<div class="marcas"><span>día 1</span><span>día 90</span></div>'+

     (c.fuente==='llamada'?' Contado desde la primera llamada registrada, porque el START no está cargado.':'')+'</p></div>';
  h+='</aside></div></div>';
