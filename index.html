a revisarlos antes de mandarlos.","e":"en borrador","f":["HTML","PDF"],"u":""},{"t":"Informes de cierre · 8 clientes","q":"Andrea, Antonio, Ayelén, Lucca, Manu, Nicolás, Scarlett y Sharon. Cierra el proceso y deja los próximos 60 días escritos para que los ejecuten solos. Las llamadas de sign-off las hace Teo. Falta revisarlos antes de mandarlos.","e":"en borrador","f":["HTML","PDF"],"u":""},{"t":"Qualita · Radiografía y roadmap de retoma","q":"Primera corrida de la skill de radiografía. Está entregada y esperando la decisión de Rafa.","e":"listo","f":["Markdown","Canvas"],"u":""},{"t":"Qualita · Roadmap Cáscara Founders","q":"Catorce paneles en el formato oficial de roadmap de cliente. Es la referencia visual para los que vengan.","e":"listo","f":["Canvas"],"u":""},{"t":"Formulario de construcción de oferta","q":"40 preguntas en 8 bloques: resultado, paso a paso, módulos, cliente y precio. Se le manda al founder antes del 1:1 con Franco. Activo reutilizable para todos los clientes.","e":"listo","f":["Markdown"],"u":""},{"t":"Briefing de clarity call","q":"Una carilla antes de la llamada: el problema en una línea, síntoma contra problema real, la métrica del trimestre, los activos y los vacíos, y dos o tres tensiones para abrir. Ya se hizo para Sebastián, beMOTION y Sofía.","e":"listo","f":["Markdown"],"u":""},{"t":"Paquete de entregables de cierre","q":"Lo que el founder se lleva para ejecutar solo. El modelo probado es el de Ceci: auditoría de producto e instrumentación de la plataforma, estructura y copy de landing, calendario de contenido repetible y playbook de outreach en frío con templates.","e":"listo","f":["Markdown"],"u":""},{"t":"Handoff de diseño de la radiografía","q":"El formato con el que se maqueta cada documento: header con la métrica, timeline continuo con las 1:1 y la banda de acompañamiento async, checklist de reuniones, bloque de oferta y pipeline.","e":"listo","f":["Markdown"],"u":""}]},{"n":"Los contratos","piezas":[{"t":"Contrato de Cáscara Founders","q":"No existe. Hoy se firma con el template del programa B2C, prestado. Es el primer pendiente de la lista del informe maestro.","e":"falta escribir","f":[],"u":""},{"t":"Template de contrato B2C","q":"El contrato del programa B2C. Es el que se usa mientras no esté el propio de la aceleradora.","e":"listo","f":[],"u":""},{"t":"Prompt maestro de generación de contratos","q":"Datos de la entidad, el template y un bloque de pedido por propuesta. Genera el contrato a partir de la propuesta comercial.","e":"listo","f":["Markdown"],"u":""},{"t":"Acuerdo de growth partner","q":"El modelo para los casos de nivel 3: rev share sobre profit neto, waterfall de comisiones, costos directos y split. Regla fija: el acuerdo interno y el acuerdo con el cliente van siempre separados.","e":"listo","f":["Markdown","PDF"],"u":""},{"t":"Briefing legal de growth partner","q":"Qué es un growth partner y cómo se calcula el profit, escrito para que lo lea el abogado. Hecho para MySaint y para Daniella Aiello.","e":"listo","f":["PDF"],"u":""},{"t":"Contrato de partnership · Delfina Ferro","q":"Treinta y seis artículos redactados completos, con notas de redacción para legales. Está esperando la revisión legal.","e":"en borrador","f":["Word"],"u":""}]},{"n":"Los procesos internos","piezas":[{"t":"Proceso de consultoría de founders","q":"Cómo se atiende a un founder de punta a punta: el día 0 de onboarding, la cadena de accionables semana por semana, las 10 llamadas 1:1, las tres orientaciones, la radiografía, la anatomía de una grupal y la cuenta de capacidad. Es el documento que hay que leer primero.","e":"listo","f":["Markdown"],"u":""},{"t":"Checklists por orientación","q":"Qué tiene que estar hecho en Conseguir, en Sostener y en Entregar, más el piso común a las tres al día 90. Van como anexo del informe maestro.","e":"listo","f":["HTML"],"u":"https://facundocouyet.github.io/aceleradora/informe.html"},{"t":"Mapa de mentores","q":"Qué le lleva el founder a cada uno y qué no. Franco, Facu, Fede, Juana y Teo, con los cinco frentes repartidos.","e":"listo","f":["HTML","Markdown"],"u":""},{"t":"Inventario de producción","q":"Todo lo producido por fecha, título y versión, con dónde vive y en qué estado está. Se le agrega una fila al terminar cualquier entregable.","e":"listo","f":["Markdown"],"u":""},{"t":"Índice del sistema","q":"Qué documento sirve para qué y en qué orden se leen. Las reglas del sistema están acá: un paso abierto por día, cada entregable al inventario con versión, las decisiones de proceso se escriben y no quedan en un chat.","e":"listo","f":["Markdown"],"u":""},{"t":"Repaso de clientes · Teo y Facu","q":"La charla del 2 de septiembre pasada a documento. De ahí salieron los diecinueve documentos de cliente, los módulos por categoría y las decisiones de proceso.","e":"listo","f":["HTML","Notion"],"u":""},{"t":"Roadmap de automatización","q":"Qué se automatiza, con qué herramienta y en qué fase. Es el documento que se lee para elegir el próximo paso.","e":"listo","f":["Markdown"],"u":""},{"t":"Padrón de clientes","q":"El cruce de las dos bases de clientes de Notion: quién tiene ficha, quién está desalineado y qué duplicados hay. Se lee antes de dar una lista de clientes por cerrada.","e":"listo","f":["Markdown","Notion"],"u":""},{"t":"Plantilla de paneles de founders","q":"El generador del formato oficial de paneles, 1920 por 1080, para presentar roadmaps de clientes. Se cambia el contenido, se corre y se publica.","e":"listo","f":["Script","HTML"],"u":""},{"t":"Handoffs de chats y de diseño","q":"Lo que quedó de 137 chats de trabajo y 47 de diseño: qué se produjo, qué se decidió, los números y los pendientes. Se busca acá antes de rehacer algo.","e":"listo","f":["Markdown"],"u":""}]}],"modulos":[{"c":"Mirada de negocio","porque":"Los clientes llegan con muchos frentes abiertos y sin un punto A escrito, y sin eso cada llamada arranca discutiendo qué hay que hacer.","items":[{"id":"radiografia-360","t":"360 del negocio: punto A, cuello de botella y punto B","x":"Un documento de dos carillas con los números de hoy, un solo cuello de botella nombrado y un punto B con fecha.","e":"existe","q":"Se le asigna a todo founder en el primer mes, antes de tocar oferta o contenido.","ej":["oferta","contenido","demanda","venta","entrega"],"p":["Juntar en una carpeta todo lo que existe: ventas de los últimos 90 días, precios cobrados, piezas publicadas, clientes activos y horas propias por semana.","Escribir el punto A con hechos: qué vendió, a qué precio, qué produce y qué tiene armado.","Puntuar los cinco ejes de cero a cuatro con la escalera del handicap, apoyando cada número en una evidencia concreta.","Marcar el eje más bajo y escribir el cuello de botella en una sola frase.","Fijar el punto B: un número, una fecha y cómo se va a medir.","Elegir la métrica del trimestre y dejarla en el encabezado del documento, a la vista."],"cc":["La planilla de punto A con ventas, precios y clientes de los últimos 90 días","La grilla de los cinco ejes con la evidencia de cada número","La frase del cuello de botella y la del punto B con fecha"],"hh":["Notion (página de radiografía del founder)","Google Sheets para el punto A"],"pl":false},{"id":"foco-y-ventana","t":"Elegir la ventana y soltar el resto","x":"Una hoja con la ventana elegida, la fecha en el calendario y la lista de lo que queda en pausa hasta esa fecha.","e":"existe","q":"Cuando el founder tiene tres o cuatro frentes abiertos y avanza poco en todos.","ej":["oferta","demanda"],"p":["Listar todos los frentes abiertos hoy, incluidos los proyectos personales y los eventos ya comprometidos.","Marcar al lado de cada uno la fecha real y qué resultado deja si sale bien.","Elegir una sola ventana, la más cerca del dinero, y ponerle fecha de inicio y de cierre.","Escribir qué queda en pausa hasta esa fecha, con nombre y apellido de cada cosa.","Avisarle a las personas involucradas en lo que queda en pausa.","Bloquear en el calendario las horas semanales que vive esa ventana."],"cc":["La lista de frentes abiertos con fecha y resultado esperado","La hoja de la ventana elegida con fecha de inicio y de cierre","La lista de pausas con los avisos hechos"],"hh":["Google Calendar","Notion (tablero de foco del trimestre)"],"pl":true},{"id":"sociedad-y-roles","t":"Resolver la sociedad que frena","x":"Una hoja de acuerdo con quién resuelve qué, cómo se reparte la plata y con qué aviso se sale, conversada con la otra parte.","e":"existe","q":"Cuando hay una socia, un socio o una estructura compartida que le come tiempo y decisión al proyecto propio.","ej":["entrega","oferta"],"p":["Escribir qué resuelve cada socio hoy en cada cliente y en cada tarea, tal como pasa.","Marcar las tareas que hacen los dos y las que no hace nadie.","Poner los números arriba de la mesa: qué entra, qué sale y cuánto retira cada uno.","Definir el reparto y el aviso de salida por escrito, con revisión trimestral del aporte de cada uno.","Tener la conversación de fondo con la otra parte, informando la decisión tomada.","Dejar el acuerdo firmado o confirmado por escrito y guardarlo donde los dos lo vean."],"cc":["El cuadro de quién resuelve qué, socio por socio","Los números de ingresos, egresos y retiros de los últimos tres meses","La hoja de acuerdo con reparto, aviso y revisión trimestral"],"hh":["Notion (documento de acuerdo entre socios)","Google Sheets para el reparto"],"pl":true}]},{"c":"Oferta y precio","porque":"Casi todos saben explicar lo que hace y no lo tiene escrito con cliente, promesa y precio, y ese es el eje más bajo del handicap en la mayoría de los casos.","items":[{"id":"icp-mecanismo","t":"ICP del mecanismo que vendés","x":"Una hoja con el cliente ideal escrito: quién es, en qué momento está, qué problema tiene y con qué palabras lo cuenta.","e":"existe","q":"Cuando el founder describe a su cliente por rubro o por tamaño y todavía no por el problema que le resuelve el mecanismo.","ej":["oferta"],"p":["Listar los últimos diez clientes o consultas y anotar qué compró cada uno y por qué.","Quedarse con los tres que dejaron mejor resultado y buscar qué tienen en común.","Escribir el cliente ideal en una frase que incluya momento del negocio, problema y presupuesto.","Anotar los dolores con las palabras textuales que usa el cliente, sacadas de mensajes y llamadas.","Definir la subcategoría donde se posiciona el mecanismo, para dejar de competir por precio.","Descartar por escrito los nichos que quedan afuera del tramo."],"cc":["El formulario de ICP y dolores con las palabras textuales del cliente","La tabla de los últimos diez clientes o consultas con motivo de compra","La frase del cliente ideal y la subcategoría elegida"],"hh":["Notion (base de clientes y consultas)","Formulario de ICP y dolores de Cáscara"],"pl":true},{"id":"one-sheeter-oferta","t":"One-sheeter de la oferta","x":"Una hoja con la promesa, el resultado escrito en número, el paso a paso de la entrega, los entregables y el plazo.","e":"existe","q":"Cuando la oferta vive en la cabeza del founder y cada conversación de venta la explica distinto.","ej":["oferta"],"p":["Completar el formulario de construcción de oferta —40 preguntas en 8 bloques— que Cáscara te manda antes de la sesión con Franco.","Escribir la promesa en una frase, con el resultado en número y el plazo en el que se mide.","Bajar el paso a paso de la entrega en etapas, con el entregable de cada una.","Listar qué incluye, qué queda afuera y qué necesita del cliente para que funcione.","Cerrar los módulos de la oferta y decidir cuáles se venden juntos y cuáles por separado.","Pasar la hoja a una sola página presentable y probarla en una conversación real."],"cc":["El formulario de construcción de oferta completo","La hoja de promesa, resultado en número, plazo y paso a paso","La lista de incluye, no incluye y requisitos del cliente"],"hh":["Formulario de construcción de oferta (40 preguntas, 8 bloques)","Notion (página de oferta)","Canva o Claude Design para la hoja presentable"],"pl":true},{"id":"precio-escalera","t":"Precio y escalera de valor","x":"La tabla de precios de cada nivel con la forma de pago, y el orden en que se comunica cada uno.","e":"existe","q":"Cuando el founder cobra por debajo de lo que entrega, o cuando quiere sumar un producto arriba o abajo de lo que ya vende.","ej":["oferta","venta"],"p":["Calcular el costo real de entregar una vez: horas propias, equipo, herramientas y producción.","Poner el piso en el costo por dos y comparar contra lo que se cobra hoy.","Definir la escalera: entrada, oferta principal y lo que va arriba, con el resultado de cada nivel.","Fijar la forma de pago: precio de lista, precio pagando por adelantado y precio en dos cuotas, con más de la mitad cobrada al principio.","Decidir qué nivel se comunica en público y cuál se ofrece adentro de la llamada.","Presentar el precio nuevo en al menos una propuesta real y anotar la reacción."],"cc":["La planilla de costo de entrega por cliente","La tabla de escalera con precio, resultado y forma de pago de cada nivel","La regla de que se comunica y que se guarda para la llamada"],"hh":["Google Sheets (costo de entrega y escalera)","Notion (página de pricing)","Stripe o link de pago para el cobro por adelantado"],"pl":true},{"id":"cinco-llamadas-con-precio","t":"Las primeras cinco llamadas con precio","x":"Cinco llamadas hechas con el precio dicho, cada una con la objeción anotada y la corrección que sale de ahí.","e":"existe","q":"Cuando la oferta ya está escrita y el founder todavía no la puso arriba de la mesa con un número.","ej":["venta","oferta"],"p":["Elegir cinco personas del entorno que entren en el cliente ideal escrito.","Presentar la oferta completa con el precio, sin descuentos y sin versiones gratis.","Grabar cada llamada y anotar en qué momento aparece la objeción.","Registrar la objeción textual de cada una en la misma planilla.","Corregir la promesa, el precio o el cliente ideal con lo que salió de las cinco.","Cerrar la hipotesis de precio con el número que sostuvo más conversaciones."],"cc":["La lista de las cinco personas con fecha de llamada","La planilla de objeciones textuales llamada por llamada","La corrección escrita de la oferta después de las cinco"],"hh":["Google Meet o Zoom con grabación","Google Sheets (planilla de objeciones)","Calendly"],"pl":true}]},{"c":"Contenido y marca","porque":"La mitad de los clientes publica sin criterio que una las piezas, y la otra mitad tiene el criterio y no sostiene el volumen.","items":[{"id":"profile-funnel","t":"Profile funnel del perfil","x":"El perfil acomodado: descripción, destacadas, contenido anclado y archivo, de manera que en quince segundos se entienda quién es y qué vende.","e":"existe","q":"Se le asigna a todo founder antes de que salga la primera pieza del tramo.","ej":["contenido","demanda"],"p":["Escribir la descripción con quién es, a quién le sirve y qué hacer ahora.","Armar las destacadas: la historia, el servicio, los casos y cómo contactar.","Anclar las tres piezas que mejor explican la oferta.","Archivar las publicaciones repetidas y las que hablan de otra cosa.","Pasar la cuenta a profesional y revisar el enlace de contacto.","Mandar el perfil a tres personas de afuera y preguntarles qué entendieron."],"cc":["El checklist del SOP de profile funnel, punto por punto","El texto de la descripción y los titulos de las destacadas","La devolución de las tres personas que miraron el perfil"],"hh":["Instagram (cuenta profesional)","SOP de profile funnel de Cáscara","Canva para las portadas de destacadas"],"pl":false},{"id":"angulos-desde-icp","t":"Ángulos de comunicación bajados del ICP","x":"Una lista de ocho a doce ángulos, cada uno con una idea concreta y un guion de ejemplo al lado.","e":"existe","q":"Cuando el founder tiene la oferta escrita y cada pieza arranca de una hoja en blanco.","ej":["contenido"],"p":["Tomar los dolores del ICP y convertir cada uno en una pregunta que el cliente ya se hace.","Escribir un ángulo por dolor, con el giro propio que lo vuelve reconocible.","Bajar una idea concreta por ángulo: qué se muestra, en qué formato y con qué cierre.","Escribir un guion de ejemplo completo para el ángulo más fuerte.","Ordenar los ángulos por cercanía a la venta y elegir los tres del primer mes.","Cargar los ángulos en el calendario y publicar contra ellos."],"cc":["La tabla de ángulos con dolor, idea concreta y formato","El guion de ejemplo del ángulo principal","Los tres ángulos elegidos para el primer mes"],"hh":["Notion (base de ángulos e ideas)","Hoja de frases propias del founder"],"pl":true},{"id":"calendario-contenido","t":"Calendario de contenido de sesenta días","x":"Un calendario de sesenta días cargado, con cadencia semanal, formato y ángulo en cada tarjeta.","e":"existe","q":"Cuando el founder publica cuando le queda tiempo y la cadencia se cae sola.","ej":["contenido"],"p":["Definir la cadencia real que puede sostener: cantidad de piezas por semana y día de publicación.","Elegir dos o tres formatos fijos y dejar una referencia y un ejemplo de cada uno.","Cargar las tarjetas de sesenta días con objetivo, formato, ángulo y fecha.","Reservar una jornada semanal fija de grabación y meterla en el calendario.","Definir quién guiona, quién graba, quién edita y quién publica cada pieza.","Revisar el calendario una vez por semana y mover solo lo que no salió."],"cc":["La cadencia semanal comprometida, con día y cantidad","Las tarjetas de sesenta días con ángulo y formato","La jornada semanal de grabación agendada"],"hh":["Notion (base de calendario de contenido)","Google Calendar para la jornada de grabación","Template de calendario de contenido de Cáscara"],"pl":true},{"id":"diez-piezas-y-lectura","t":"Las diez piezas y su lectura","x":"Diez piezas publicadas contra los ángulos definidos y una carilla de lectura que dice qué ángulo sostener y qué corregir.","e":"existe","q":"Cuando el founder quiere saber si su contenido funciona y todavía no público volumen suficiente para saberlo.","ej":["contenido","demanda"],"p":["Comprometer diez piezas con fecha, todas contra los ángulos elegidos.","Publicar sin cambiar el eje en el medio, aunque las primeras rindan poco.","Registrar en cada pieza las conversaciones que abrió y los temas sobre los que le escribieron.","Comparar las mejores y las peores piezas: expectativa contra resultado.","Escribir la carilla de lectura con los patrones que se repiten.","Decidir qué ángulo se sostiene, cuál se corrige y cuál se descarta."],"cc":["La planilla de las diez piezas con fecha, ángulo y conversaciones abiertas","La comparación de mejores y peores piezas","La carilla de lectura con la decisión de ángulos"],"hh":["Notion (registro de piezas y respuestas)","Estadisticas de Instagram y YouTube"],"pl":true},{"id":"formato-barato","t":"El formato barato que se sostiene","x":"Un formato propio definido y probado con dos piezas publicadas, con el costo por pieza escrito.","e":"existe","q":"Cuando la producción propia es tan cara o tan pulida que el volumen se cae.","ej":["contenido"],"p":["Revisar qué piezas propias funcionaron y con qué nivel de producción salieron.","Elegir un formato de bajo costo: entrevista cruda con alguien preguntando, video largo sin guion, o el trabajo real con voz en off.","Definir el setup fijo: lugar, luz, cámara, duración y quién pregunta.","Fijar el nivel de edición y el techo de costo por pieza.","Grabar y publicar dos piezas con ese formato, sin libreto.","Dejar escrito el formato como estándar para las próximas diez."],"cc":["La hoja del formato con setup, duración y quién pregunta","El techo de costo por pieza y el nivel de edición","Las dos primeras piezas publicadas con ese formato"],"hh":["Camara de celular","Editor de nivel uno (clipeo, subtitulos, color)","Tarifario de edición de Cáscara"],"pl":true},{"id":"caso-documentado","t":"El caso documentado del cliente que ya tenés","x":"Dos o tres fichas de caso con números antes y después, y el registro en video o foto del proceso.","e":"existe","q":"Cuando el founder ya entregó resultados y no tiene con qué probarlos frente a un cliente nuevo.","ej":["contenido","venta"],"p":["Elegir los clientes con resultado medible y pedirles permiso para documentar.","Juntar los números de entrada y los de salida, con fecha de cada medición.","Grabar o fotografiar el proceso mientras pasa, sin esperar el cierre.","Escribir la ficha: punto de partida, qué se hizo, qué cambió y en cuánto tiempo.","Pedirle al cliente una frase corta sobre el cambio.","Usar la ficha adelante en la prospección y en el contenido."],"cc":["La lista de clientes con resultado medible y permiso confirmado","Los números antes y después de cada caso","Las fichas escritas con la frase del cliente"],"hh":["Notion (base de casos)","Canva o Claude Design para la ficha","Google Sheets con los números del caso"],"pl":true}]},{"c":"Demanda y comunidad","porque":"Varios founders tienen tráfico o gente reunida y nada armado que lleve de la atención a la conversación.","items":[{"id":"arquitectura-comunidad","t":"Arquitectura minima de una comunidad","x":"La comunidad con su arquitectura corriendo: ritual de bienvenida, un reto por mes, curaduría de recursos y el registro de quién participa.","e":"existe","q":"Cuando el founder tiene gente reunida en un grupo o una lista y adentro no pasa nada.","ej":["demanda","entrega"],"p":["Definir para qué existe la comunidad y qué hace la gente adentro cada semana.","Instalar el ritual de bienvenida y la respuesta a cada presentación.","Armar el calendario de dinamicas: llamada mensual, un reto por mes, curaduría de recursos y premios por participación.","Definir cómo se llena: qué contenido de YouTube y de redes baja tráfico al grupo y con qué motivo.","Registrar quién participa y quién compra, para identificar al buyer que ya está adentro.","Leer una vez por mes qué parte de las ventas salió de la comunidad."],"cc":["El calendario de dinamicas del mes","El texto del ritual de bienvenida","La base de miembros con participación y compras"],"hh":["WhatsApp (comunidad)","Notion o Airtable (base de miembros)","Skool si el producto es formativo"],"pl":true},{"id":"handraisers-historias","t":"Historias con handraisers","x":"Una secuencia de historias corriendo que levanta manos y deriva cada mano a una conversación registrada.","e":"existe","q":"Cuando el founder publica y no tiene un mecanismo que convierta la atención en conversación.","ej":["demanda","venta"],"p":["Elegir el contenido que ya está caliente y montar la secuencia arriba de eso.","Escribir la secuencia: contexto, problema, prueba y la pregunta que levanta la mano.","Definir el mecanismo de respuesta: palabra clave, encuesta o pregunta directa.","Publicar la secuencia el mismo día que el contenido que la alimenta.","Derivar cada mano levantada a una conversación, con un mensaje escrito de antemano.","Registrar cada mano en el pipeline con motivo y próxima acción."],"cc":["El guion de la secuencia de historias, placa por placa","El mensaje de derivación escrito","El registro de manos levantadas y conversaciones abiertas"],"hh":["Instagram Stories","ManyChat","Notion o Airtable (pipeline)"],"pl":true},{"id":"calendario-lanzamiento","t":"Calendario de lanzamiento","x":"Un calendario de cuarenta y cinco días con fecha de apertura y de cierre, y el contenido de cada día cargado.","e":"existe","q":"Cuando el founder tiene un producto listo y ninguna fecha ni mecanica para venderlo.","ej":["demanda","venta"],"p":["Poner la fecha de apertura y de cierre en el calendario y avisarla al equipo.","Armar los primeros quince días de historia propia y calentamiento de audiencia.","Cargar el bloque de problema y después el de solución, con una pieza por día.","Definir la dinamica de activación: workshop o bootcamp en vivo dando valor, con registro de asistentes.","Dejar la parte comercial al final, con cupos, fecha de cierre y seña para reservar.","Correr el lanzamiento tal como está escrito y anotar cada día que trajo."],"cc":["Las fechas de apertura y cierre en el calendario","El calendario día por día con la pieza de cada uno","El registro de asistentes del workshop y de las manos levantadas"],"hh":["Notion (calendario de lanzamiento)","Instagram y WhatsApp para el tráfico","Google Meet o Zoom para el workshop"],"pl":true},{"id":"capitalizar-evento","t":"Capitalizar un evento presencial","x":"El evento convertido en material publicado, base de datos de asistentes y conversaciones abiertas.","e":"existe","q":"Cuando el founder da una charla, un taller o va a un evento y todo eso se termina el mismo día.","ej":["demanda","contenido"],"p":["Definir antes del evento qué se lleva: registro de asistentes, video de la charla y extractos.","Grabar la charla completa y subirla cruda al canal propio.","Sacar historias y un carrusel que lleven tráfico a ese video, el mismo día.","Al día siguiente publicar el posteo con los mensajes recibidos, repartiendo el link desde los comentarios.","Cargar a cada asistente en la base con de dónde vino y qué le interesa.","Abrir conversación con los que dejaron datos, dentro de las 48 horas."],"cc":["La hoja de qué se lleva del evento, hecha antes","La base de asistentes con origen e interes","El registro de conversaciones abiertas después del evento"],"hh":["YouTube para la charla completa","ManyChat para repartir el link","Notion o Airtable (base de asistentes)"],"pl":true}]},{"c":"Comercial y ventas","porque":"Varios casos tienen oferta, audiencia y nada que lleve de la conversación a la plata, y las llamadas se caen siempre en el mismo lugar.","items":[{"id":"pipeline-7-campos","t":"Pipeline de siete campos","x":"Un pipeline único con todos los contactos cargados y una próxima acción con fecha en cada uno.","e":"existe","q":"Se le asigna a todo founder que ya tiene consultas entrando y las maneja de memoria.","ej":["venta","demanda"],"p":["Armar la base con los siete campos: contacto, fuente, etapa, objeción, presupuesto, próxima acción y fecha.","Volcar ahí todo lo que hay hoy: mensajes, Calendly, planillas sueltas y contactos viejos.","Definir las etapas con nombre propio, de primer contacto a cerrado.","Cargar cada conversación nueva el mismo día que pasa.","Revisar el pipeline una vez por semana y mover las próximas acciones vencidas.","Leer una vez por mes de dónde vino cada venta."],"cc":["La base de siete campos con todos los contactos cargados","Las etapas definidas con nombre propio","La revisión semanal agendada en el calendario"],"hh":["Notion o Airtable (pipeline)","Calendly","Google Sheets si arranca simple"],"pl":false},{"id":"prospeccion-y-recontacto","t":"Recontacto de la base y prospección directa","x":"Veinte conversaciones nuevas por semana corriendo, entre base historica y contactos nuevos, con el registro de cada una.","e":"existe","q":"Cuando el founder necesita ventas en sesenta días y el contenido solo no llega a tiempo.","ej":["venta","demanda"],"p":["Juntar la base historica: clientes viejos, presupuestos que no cerraron y contactos del Calendly.","Ordenar la base por cercanía: ya compró, pidió presupuesto, solo consulto.","Escribir el mensaje de recontacto con el caso documentado adelante, distinto para cada grupo.","Recontactar cinco personas por día de la base historica.","Armar la lista de cincuenta prospectos nuevos que entren en el ICP y contactar veinte por semana.","Cargar cada respuesta en el pipeline con objeción y próxima acción."],"cc":["La base historica ordenada por cercanía","Los mensajes de recontacto y de prospección escritos","El registro diario de contactos hechos y respuestas"],"hh":["Notion o Airtable (pipeline)","WhatsApp e Instagram para el contacto","Calendly para agendar"],"pl":true},{"id":"llamada-de-venta","t":"La llamada de venta y el cierre","x":"Un guion de llamada propio, cinco llamadas grabadas con su objeción anotada y el mecanismo de cierre definido.","e":"existe","q":"Cuando el founder abre bien las conversaciones y se le caen al final.","ej":["venta"],"p":["Escribir el guion en cuatro tramos: contexto, dolor, costo de no avanzar y propuesta con precio.","Definir el cierre: cupos limitados, fecha y seña para reservar el lugar.","Dejar el downsell fuera de la comunicación y ofrecerlo solo adentro de la llamada cuando el freno es el precio.","Grabar todas las llamadas y revisarlas con el mentor.","Anotar la objeción textual de cada llamada que no cerró.","Corregir el guion y el contenido con las objeciones que se repiten."],"cc":["El guion de llamada en cuatro tramos","Las grabaciones de las llamadas subidas donde el mentor las vea","La planilla de objeciones con la corrección aplicada"],"hh":["Google Meet o Zoom con grabación","Notion (guion y objeciones)","Link de pago para la seña"],"pl":true},{"id":"propuesta-comercial","t":"Propuesta comercial con esqueleto fijo","x":"Una plantilla de propuesta propia y una propuesta real enviada con el precio nuevo.","e":"existe","q":"Cuando el founder arma cada presupuesto de cero y tarda días en mandarlo.","ej":["venta","oferta"],"p":["Armar el esqueleto fijo: portada, objetivos y modalidad, alcance con incluye y no incluye, fases, equipo e inversión.","Escribir el alcance con la aclaración de qué necesita del cliente para cumplirse.","Partir el trabajo en fases con el entregable de cada una.","Dejar la inversión en una sola lamina, con forma de pago.","Armar la propuesta desde las notas de la llamada de venta, sin inventar nada nuevo.","Mandarla dentro de las 48 horas de la llamada y registrar la respuesta."],"cc":["La plantilla de propuesta con el esqueleto fijo","El texto de alcance con incluye, no incluye y requisitos","La primera propuesta real enviada con el precio nuevo"],"hh":["Canva o Claude Design","Notion (plantilla de propuesta)"],"pl":false},{"id":"setter-closer","t":"Sumar un setter o un closer","x":"Una persona incorporada con scope, guion y comisión escritos, y las primeras llamadas hechas con ella adentro.","e":"existe","q":"Cuando el volumen de conversaciones pasa lo que el founder puede atender solo, o cuando el cierre se le escapa siempre en el mismo lugar.","ej":["venta"],"p":["Separar las dos tareas: quién abre y filtra conversaciones, y quién cierra.","Decidir cuál de las dos suelta primero, mirando dónde se pierde más plata hoy.","Escribir el scope: qué hace, con qué guion, cuántas conversaciones por día y qué reporta.","Definir la compensación: fijo, comisión por cierre y cuando se paga.","Reclutar, entrevistar y hacer una prueba paga sobre conversaciones reales.","Correr las primeras diez llamadas escuchando las grabaciones y corrigiendo el guion."],"cc":["El scope del rol con guion y números de actividad","El esquema de comisión escrito","Las grabaciones de la prueba paga con la devolución hecha"],"hh":["Notion (scope y guion del rol)","Formulario de postulación","Pipeline en Notion o Airtable"],"pl":true}]},{"c":"Entrega del servicio","porque":"Hay founders que venden bien y quedan sin sistema el día después de la venta, y ahí se les va el tiempo y la rentabilidad.","items":[{"id":"onboarding-y-roadmap-cliente","t":"Onboarding a 48 horas y roadmap para el cliente","x":"Un onboarding que corre dentro de las 48 horas de cada venta y un roadmap con hitos presentado al cliente.","e":"existe","q":"Cuando la venta cae y a partir de ahí el founder improvisa.","ej":["entrega"],"p":["Escribir la secuencia de las primeras 48 horas: mensaje de bienvenida, accesos, formulario y reunión de arranque.","Armar el formulario de arranque con lo que hace falta saber antes de producir.","Armar la plantilla de roadmap con hitos, fechas y quién responde por cada uno.","Presentarle el roadmap al cliente en una reunión, no por mensaje.","Dejar el roadmap en un lugar donde el cliente lo vea y se actualice.","Aplicarlo a los clientes que ya están adentro y corregir lo que se rompa."],"cc":["La secuencia escrita de las primeras 48 horas","El formulario de arranque del cliente","El roadmap presentado a cada cliente activo"],"hh":["Notion (OS del cliente con el roadmap adentro)","Formulario de onboarding","WhatsApp o mail para la secuencia"],"pl":true},{"id":"proceso-entrega-repetible","t":"Proceso de entrega que se repite igual","x":"El proceso de entrega escrito en un documento, con horas reales por etapa, aplicado a un cliente de prueba.","e":"existe","q":"Cuando cada cliente se entrega distinto y todo depende de que el founder esté arriba.","ej":["entrega"],"p":["Mapear las entregas en curso: que se prometió, en qué estado está y que se resuelve sobre la marcha.","Medir las horas reales que lleva cada etapa, incluidas las propias.","Escribir el proceso paso por paso, con el entregable y el responsable de cada etapa.","Definir la capacidad: cuántos clientes entran con el equipo de hoy.","Aplicarlo a un cliente de prueba y corregir el documento con lo que se rompa.","Dejar el proceso donde el equipo lo use todos los días."],"cc":["El mapa de servicio con horas reales por etapa","El documento de proceso con responsables","El número de capacidad: cuántos clientes entran hoy"],"hh":["Notion (documento de proceso y estados)","Google Sheets para las horas por etapa"],"pl":true},{"id":"alcance-por-escrito","t":"Alcance del servicio por escrito","x":"Un documento de alcance por cliente, aceptado por escrito antes de arrancar.","e":"existe","q":"Cuando el cliente pide cosas que nunca se cotizaron y el founder las hace igual.","ej":["entrega","oferta"],"p":["Listar todo lo que se está entregando hoy por cliente, incluido lo que no se cotizó.","Separar qué entra en el estándar, qué se cobra aparte y qué queda afuera.","Escribir el alcance en una página, con cantidades y plazos.","Definir qué necesita el founder del cliente para cumplir, con la consecuencia si no llega.","Elegir la forma de formalizarlo: página con confirmación de lectura, mail aprobado o contrató simple.","Aplicarlo a cada cliente nuevo antes de arrancar y a los actuales en el próximo ciclo."],"cc":["La lista de lo que se entrega hoy por cliente","El documento de alcance de una página","La confirmación escrita de cada cliente"],"hh":["Notion con confirmación de lectura","Mail para la aprobación","Contrato simple cuando el ticket lo pide"],"pl":true},{"id":"ciclo-y-continuidad","t":"Cierre de ciclo y venta de continuidad","x":"Cada cliente con su ciclo cerrado, su informe de resultados y la continuidad presentada por bloques de tres meses.","e":"existe","q":"Cuando el founder tiene clientes en mensualidad abierta y ninguna conversación de renovación.","ej":["entrega","venta"],"p":["Definir el ciclo: bloques de tres meses con objetivo macro y objetivo por mes.","Armar el informe de cierre con lo que se hizo, los números y lo que queda abierto.","Agendar la reunión de cierre con cada cliente antes de que termine el bloque.","Presentar la continuidad del bloque siguiente con objetivo, alcance y precio.","Escribir el criterio de salida: aviso con un mes y ciclo terminado.","Registrar qué clientes renovaron y con qué objetivo."],"cc":["El calendario de ciclos de cada cliente con fecha de cierre","El informe de cierre de cada ciclo","La propuesta de continuidad presentada"],"hh":["Notion (OS del cliente con ciclos)","Canva o Claude Design para el informe","Google Calendar para las reuniones de cierre"],"pl":true}]},{"c":"Operaciones, equipo y calendario","porque":"El diseño está bien en varios casos y lo que falla es la repetición: nada tiene dueño ni fecha de revisión.","items":[{"id":"os-en-notion","t":"El OS del negocio en Notion","x":"Un espacio único con una página por cliente, el calendario adentro y los estados configurados para que entre alguien más.","e":"existe","q":"Se le asigna a todo founder que tiene la información repartida en planillas, chats y cabezas.","ej":["entrega"],"p":["Duplicar el template y armar una página por cliente.","Pasar los calendarios de contenido y las tareas a esas páginas.","Configurar los estados de cada tarea, de pedido a publicado.","Definir qué se carga ahí siempre y qué queda afuera.","Dar acceso al equipo y a los clientes que corresponda, con permisos distintos.","Revisarlo en la reunión semanal y cerrar lo que quedó sin estado."],"cc":["Una página por cliente con el calendario adentro","Los estados de tarea configurados","La lista de quién tiene acceso a qué"],"hh":["Notion (template del OS de Cáscara)","Google Drive para archivos pesados"],"pl":false},{"id":"cadencia-y-duenos","t":"Duenos y cadencia de revisión","x":"Un cuadro con el dueño de cada frente y las reuniones fijas agendadas, con la primera ronda ya corrida.","e":"existe","q":"Cuando el founder ya tiene equipo o colaboradores y las cosas salen cuando salen.","ej":["entrega","contenido"],"p":["Listar los frentes que tienen que pasar todas las semanas y todos los meses.","Poner un solo nombre al lado de cada frente, empezando por el dueño del calendario de contenido.","Definir la cadencia: planificación mensual de dos horas el último lunes y revisión de medio mes por persona.","Escribir los estándares no negociables de cada rol, con la consecuencia si no se cumplen.","Agendar las reuniones en el calendario de todos, con el número que se mira en cada una.","Correr la primera planificación mensual con el equipo completo y dejar el acta."],"cc":["El cuadro de frentes con un dueño por frente","Las reuniones fijas agendadas con su número","El acta de la primera planificación mensual"],"hh":["Google Calendar","Notion (acta y estándares por rol)"],"pl":true},{"id":"contratar-primer-rol","t":"Contratar la primera persona","x":"Una persona trabajando con scope escrito, prueba paga hecha y acuerdo de compensación cerrado.","e":"existe","q":"Cuando el founder llego al techo de sus propias horas y todavía no delego nada.","ej":["entrega"],"p":["Escribir el scope del rol antes de buscar: proposito, responsabilidades, cadencia y qué reporta.","Contratar con el estado real del negocio de hoy, con el número que se puede sostener todos los meses.","Publicar la busqueda con historias y llamado a un formulario de postulación.","Entrevistar y hacer una prueba paga sobre trabajo real, antes de dar responsabilidad.","Cerrar el acuerdo: número, alcance, cadencia y proyección si el negocio crece.","Darle un cliente o un frente de prueba y revisar cada entrega en la reunión semanal."],"cc":["El scope del rol escrito","El formulario de postulación publicado","El resultado de la prueba paga y el acuerdo cerrado"],"hh":["Formulario de postulación de Cáscara","Tarifario de edición de Cáscara","Notion (scope del rol)"],"pl":true},{"id":"delegar-produccion","t":"Delegar la producción sin perder calidad","x":"La producción de al menos un cliente saliendo de manos de otra persona, con brief y nivel de calidad definidos.","e":"existe","q":"Cuando el founder sigue editando o produciendo y por eso no tiene horas para lo de arriba.","ej":["entrega","contenido"],"p":["Empaquetar antes de delegar: dejar el formato, el brief y el nivel de edición escritos.","Elegir un solo cliente o un solo frente para el primer traspaso.","Armar la tarjeta de brief con objetivo, formato, referencias y fecha.","Definir el nivel de edición y el costo por pieza que se paga.","Delegar progresivo: una pieza, después una semana, después el cliente completo.","Revisar cada entrega en la reunión semanal, sin volver a editar."],"cc":["El brief tipo con objetivo, formato y referencias","El nivel de edición y el costo por pieza","El registro de cuántas piezas por mes las hace otra persona"],"hh":["Notion (tarjetas de brief y estados)","Tarifario de edición de Cáscara","Google Drive para el material crudo"],"pl":true},{"id":"diario-administrativo","t":"Diario administrativo y cierre mensual","x":"El diario cargado con ingresos y egresos explicados, y el primer cierre mensual hecho con ese formato.","e":"existe","q":"Cuando el founder no sabe con precisión qué entró, qué salió y cuánto le queda.","ej":["entrega"],"p":["Adoptar la plantilla con ingresos, egresos y una explicación por movimiento.","Cargar los últimos tres meses para tener una base de comparación.","Fijar la ventana de pagos del uno al diez y avisarla al equipo y a los proveedores.","Separar el costo del equipo del retiro propio y de la rentabilidad del negocio.","Hacer el cierre mensual con esa plantilla y leerlo contra el mes anterior.","Decidir una sola cosa con ese número: subir precio, sumar persona o frenar un gasto."],"cc":["La plantilla de diario cargada con los últimos tres meses","La ventana de pagos avisada","El primer cierre mensual escrito con su lectura"],"hh":["Plantilla de diario administrativo de Cáscara","Google Sheets"],"pl":false}]},{"c":"Datos, infraestructura y automatización","porque":"Varios founders deciden de memoria porque la información está repartida en cuatro herramientas y ninguna se puede mirar.","items":[{"id":"base-de-datos-unica","t":"Una sola base de datos, y para qué sirve","x":"Una base única con origen del contacto, compras y productos, que se puede filtrar sin depender de alguien técnico.","e":"existe","q":"Cuando la información de clientes y ventas vive en varios lugares y nadie la puede filtrar sin ayuda.","ej":["venta","entrega"],"p":["Listar dónde vive hoy cada dato: mensajes, planillas, tienda, formularios y cabezas.","Definir los campos minimos: contacto, origen, productos comprados, monto y fecha.","Elegir la arquitectura: una herramienta guarda y otra muestra, de manera que se pueda mirar y filtrar.","Volcar la información historica y marcar los duplicados.","Definir quién carga cada dato y en qué momento.","Armar tres vistas que respondan tres preguntas concretas del negocio."],"cc":["El mapa de dónde vive cada dato hoy","La base con los campos minimos y el histórico cargado","Las tres vistas con las tres preguntas que responden"],"hh":["Notion o Airtable para mostrar","Supabase o la tienda como almacenamiento","Google Sheets para la carga inicial"],"pl":true},{"id":"captura-y-seguimiento","t":"Captura automatica y seguimiento por mail","x":"La captura corriendo desde comentarios y videos, y una secuencia de mails segmentada saliendo sola.","e":"existe","q":"Cuando el contenido trae gente y esa gente se pierde porque nadie la registra ni le vuelve a escribir.","ej":["demanda","venta"],"p":["Elegir el mecanismo de captura: palabra clave en comentarios, pregunta al final del video o formulario.","Configurar la automatización que reparte el recurso y guarda el contacto.","Definir el recurso de entrada que se entrega a cambio del dato.","Segmentar la base por nivel: nunca compró, compró una vez, recompra.","Escribir una secuencia corta por segmento, con un objetivo por mail.","Medir cuántos contactos entran por semana y cuántos abren conversación."],"cc":["El mecanismo de captura configurado y probado","El recurso de entrada terminado","Las secuencias de mail por segmento escritas"],"hh":["ManyChat","Herramienta de mailing (Risen o equivalente)","Notion o Airtable como base de contactos"],"pl":true},{"id":"landing-que-convierte","t":"La landing que recibe la demanda","x":"Una landing publicada, mobile first, con el llamado a la acción visible sin scrollear y el formulario arriba.","e":"existe","q":"Cuando el founder manda tráfico a una página que no pide nada o que pide en el lugar equivocado.","ej":["demanda","venta"],"p":["Escribir el copy arrancando por la pregunta o la promesa que ya funciona en contenido.","Armar la estructura: poco aire, llamado a la acción visible sin scrollear, imagen a un lado y texto al otro.","Poner el formulario arriba de todo, con el campo del proyecto obligatorio.","Sumar captura de mail en dos lugares y el WhatsApp visible.","Comprar y conectar el dominio propio.","Medir cuántas visitas y cuántos formularios entran por semana."],"cc":["El copy de la landing con la promesa adelante","El formulario con los campos definidos","El dominio conectado y la medición semanal"],"hh":["Constructor de landing (Logoable, Shopify o equivalente)","Hostinger para el dominio","WhatsApp Business"],"pl":true},{"id":"dashboard-embudo","t":"Dashboard del embudo","x":"Un tablero de una pantalla con los números del embudo por semana y el número del trimestre arriba.","e":"existe","q":"Cuando el founder ya tiene contenido, conversaciones y ventas, y no sabe cuál de los tres se le está cayendo.","ej":["demanda","venta"],"p":["Definir los cinco números del embudo: piezas publicadas, conversaciones, llamadas, propuestas y ventas.","Elegir de dónde sale cada número y quién lo carga.","Armar el tablero con la serie semanal de los cinco.","Poner arriba la métrica del trimestre, la que decide si el tramo salió bien.","Cargarlo todas las semanas el mismo día, aunque el número sea cero.","Leerlo una vez por mes y marcar en qué paso se cae la mayor parte."],"cc":["La definición de los cinco números y su fuente","El tablero armado con la serie semanal","La lectura mensual con el paso que se cae"],"hh":["Google Sheets o Notion (tablero)","Estadisticas de Instagram y YouTube","Pipeline como fuente de llamadas y ventas"],"pl":true},{"id":"informes-con-ia","t":"Leer el negocio con IA","x":"Un informe mensual del negocio sacado de las propias bases, con tres decisiones escritas al final.","e":"existe","q":"Cuando el founder tiene información cargada y sigue decidiendo de memoria.","ej":["venta","entrega"],"p":["Ordenar la información de clientes y ventas en un solo formato exportable.","Escribir las tres preguntas que el informe tiene que contestar cada mes.","Armar el pedido de informe con esas preguntas y el formato de salida.","Correrlo con la base del mes y revisar a mano los números que no cierran.","Cerrar el informe con tres decisiones concretas y sus responsables.","Dejar el pedido guardado para repetirlo igual el mes siguiente."],"cc":["La exportación mensual de la base en un formato único","Las tres preguntas fijas del informe","El informe del primer mes con sus tres decisiones"],"hh":["Claude","Notion o Airtable como fuente","Google Sheets para la exportación"],"pl":true}]},{"c":"Identidad, narrativa y dirección creativa","porque":"Buena parte de los clientes sabe hacer el trabajo y no sabe contar quién es, y sin eso el contenido y la oferta no tienen de dónde agarrarse.","items":[{"id":"pasaporte-digital","t":"Pasaporte digital","x":"El formulario profundo completo, con la historia propia escrita y los ángulos que salen de ella.","e":"existe","q":"Cuando el founder necesita su diferencial en la comunicación y los Founder Insights no alcanzan.","ej":["contenido"],"p":["Completar el formulario profundo, respondiendo por la historia y no por el negocio.","Marcar los tres momentos que explican por qué hace lo que hace.","Sacar de ahí las obsesiones y lo que le importa, con las palabras propias.","Bajar los ángulos de comunicación que salen de esa historia, con una idea por ángulo.","Escribir el guion de la historia de origen.","Publicar la primera pieza con esa historia y leer qué contestó la gente."],"cc":["El formulario del pasaporte digital completo","Los tres momentos y las obsesiones escritas","El guion de la historia de origen"],"hh":["Formulario de pasaporte digital de Cáscara","Notion (página de narrativa del founder)"],"pl":false},{"id":"identidad-y-arco-narrativo","t":"Identidad y arco narrativo","x":"Una hoja con la posición propia: experiencia, criterio, carácter, visión y obsesiones, y el arco narrativo que sale de ahí.","e":"existe","q":"Cuando el founder cambia de mensaje todas las semanas y nada se acumula.","ej":["contenido","oferta"],"p":["Escribir lo que sabe, lo que le importa y lo que está construyendo, en tres columnas.","Cruzar las tres y sacar la perspectiva propia: qué ve que otros no ven.","Nombrar el enemigo: la idea que su trabajo viene a discutir.","Armar el arco narrativo desde la obsesión, con principio, conflicto y dirección.","Escribir la posición en una frase y probarla con tres personas.","Dejar la hoja como filtro: cada pieza y cada oferta se mide contra ella."],"cc":["Las tres columnas de lo que sé, lo que me importa y lo que estoy construyendo","La frase del enemigo y la de la posición propia","El arco narrativo escrito"],"hh":["Notion (página de identidad)","Grupal de creatividad para la calibración"],"pl":true},{"id":"direccion-visual","t":"Dirección visual y separación de cuentas","x":"Una hoja de dirección visual aplicada al perfil, y la decisión de qué se cuenta en cada cuenta.","e":"existe","q":"Cuando la estética cambia en cada pieza, o cuando dos marcas comparten la misma cuenta.","ej":["contenido"],"p":["Juntar las piezas propias de los últimos tres meses y ver qué se repite y qué no.","Definir la dirección visual: paleta, tipografía, tratamiento y nivel de producción.","Decidir qué va en cada cuenta: el proceso crudo en una, el producto y las clientas en la otra.","Aplicar la dirección al perfil, las destacadas y las tres próximas piezas.","Escribir la hoja en una página para que la use quien produzca.","Revisar a los treinta días si la cuenta se lee como una sola cosa."],"cc":["La hoja de dirección visual de una página","La decisión de qué se cuenta en cada cuenta","Las tres piezas publicadas con la dirección aplicada"],"hh":["Canva o Claude Design","Instagram","Notion (hoja de dirección visual)"],"pl":true},{"id":"narrativa-de-video","t":"Narrativa y producción de video","x":"Un video propio publicado con el proceso completo aplicado, de la idea al análisis.","e":"existe","q":"Cuando el founder quiere producir video propio y cada pieza le cuesta como un proyecto de cliente.","ej":["contenido"],"p":["Elegir el tema y armar la narrativa: cultura, oportunidad, prueba, producto y llamado a la acción.","Escribir el brief con la estructura y los planos que hacen falta.","Grabar a la manana, con luz lateral y tres planos por escena: general, medio y detalle.","Editar con el nivel definido y publicar el largo en el canal propio.","Armar la campaña alrededor: historias que dan motivo para verlo, recortes y un carrusel de detras de escena.","Leer los números a los siete días y decidir si se repite el formato."],"cc":["El brief de narrativa del video","El video largo publicado y sus recortes","La lectura de números a los siete días"],"hh":["YouTube","Camara de celular o cámara liviana","Editor de video con brief en Notion"],"pl":true}]}],"orden_cartas":["radiografia-360","foco-y-ventana","sociedad-y-roles","icp-mecanismo","one-sheeter-oferta","precio-escalera","profile-funnel","angulos-desde-icp","calendario-contenido","pasaporte-digital","identidad-y-arco-narrativo","formato-barato","diez-piezas-y-lectura","cinco-llamadas-con-precio","pipeline-7-campos","prospeccion-y-recontacto","llamada-de-venta","propuesta-comercial","caso-documentado","captura-y-seguimiento","landing-que-convierte","calendario-lanzamiento","handraisers-historias","capitalizar-evento","arquitectura-comunidad","onboarding-y-roadmap-cliente","proceso-entrega-repetible","alcance-por-escrito","ciclo-y-continuidad","os-en-notion","cadencia-y-duenos","contratar-primer-rol","delegar-produccion","base-de-datos-unica","diario-administrativo","dashboard-embudo","informes-con-ia","direccion-visual","narrativa-de-video","setter-closer","El criterio del orden: primero el diagnóstico y el foco, porque sin punto A escrito cada llamada arranca discutiendo qué hacer; después oferta, porque es el eje más bajo de los clientes y todo lo de abajo se apoya en la oferta escrita; después perfil, ángulos y calendario, que es la infraestructura de contenido que permite medir; recién ahí volumen y precio sobre la mesa, que es donde aparece la primera evidencia real; después lo comercial, que convierte esa evidencia en plata; después lanzamiento y comunidad, que necesitan audiencia calentada de antes; y al final entrega, operaciones y datos, que se asignan cuando ya hay clientes adentro que los justifiquen. El mentor mueve el orden según el eje más bajo del handicap: a Conseguir se le adelanta todo el bloque comercial, a Sostener el bloque de contenido, y a Entregar se le arranca por entrega y operaciones antes de tocar la oferta."],"entregas":{"fecha":"21 de septiembre de 2026","titulo":"Accionables CSM","bajada":"Lo que ejecuta Aye con cada cliente: qué documento le corresponde, qué hacer con él y qué coordinar. Arriba de cada lista va el resumen de su radiografía. Se actualiza con los clientes.","intro":["Cada cliente tiene su documento y su accionable de entrega. <b>Ver</b> lo abre acá adentro; <b>Descargar</b> baja el archivo que se le manda.","El orden de trabajo cambia según el grupo. En los <b>sign off</b>, el documento se muestra en la llamada y se manda después: la llamada es de informe y de cierre. En los que siguen <b>en curso</b>, el documento se manda antes y la llamada se usa para decidir sobre lo que ya leyeron."],"regla_signoff":["<b>No hay más llamadas uno a uno.</b> Lo que queda es la llamada de cierre.","<b>El grupo de WhatsApp se cierra.</b> Dejarlo abierto habilita que sigan escribiendo y que no haya respuesta del otro lado, que es peor que cerrarlo.","<b>El seguimiento de los accionables va por el grupo, mientras está abierto.</b> Un accionable que solo vive en un documento no se ejecuta.","<b>Facu desarrolla el informe, Teo hace la llamada de offboarding.</b>","<b>El documento se presenta en la llamada.</b> En los casos sin tracción ni siquiera se manda antes: se lo cuenta Teo.","<b>Se aclara de antemano de qué se trata la llamada</b>: es de informe y de cierre del programa, no una llamada más.","<b>Si alguien se queja, resuelve Teo</b> y decide sobre la marcha.","<b>Upselling: solo Lucca.</b> Sharon queda condicionada a que decida lanzar su B2C. Al resto no hay nada para ofrecerle hoy, y conviene cerrarlo limpio."],"falta":["<b>El transcript de la segunda llamada de Aaron con Franco</b>: no está en nuestro Fathom y Facu lo pide. Sin eso, el estado de Aaron se lee sólo de la del 11 de septiembre y del documento de identidad, ICP y oferta que él mismo mandó.","<b>Juanjo</b>, que viene de La Cáscara por upselling: falta crear la ficha. Recién entra, así que le corresponde el roadmap normal de los primeros 90 días y no una radiografía.","<b>La segunda persona de Custom Lab</b>: falta la ficha y falta el apellido de Juan.","<b>La fecha de inicio de casi todos.</b> Solo Sharon (13 de mayo), Lucca (6 de abril), Qualita (24 de abril), Sebastián (1 de septiembre), Sol (2 de septiembre) y The Momentum Club (16 de septiembre) la tienen cargada. Faltan las otras dieciséis, que están propuestas en el doc 17 esperando que Teo las confirme.","<b>El noveno cliente de la lista de salida.</b> En la revisión del 16/9 se contaron nueve y se nombraron ocho: Cecilia, Antonio, Manuel, Lucca, Nico, Scarlett, Sharon y Andrea. Falta saber quién es el noveno."],"aye":[["Mandar las cartas y reclamar la devolución","Trece cartas salen esta semana, cada una con su bajada escrita. Sebastián: cliente ideal y ángulos, las dos juntas. Aaron: el proceso de entrega primero, que es lo que Franco le pidió para el viernes, después el pasaporte digital y los ángulos. Sofía: las preguntas de la oferta, cliente ideal y ángulos. Matías: cliente ideal y ángulos. Lucio: profile funnel. Sol: profile funnel y contratar la primera persona. La carta se manda completa y se reclama completa: leída no es completada, y el entregable es el documento entero."],["Coordinar la próxima llamada de cada uno","Con Franco: Sofía, para bajar producto, oferta y roadmap; Sebastián, para auditar y confirmar el cliente ideal y cerrar los números; Lucio, que todavía no tuvo ninguna y es lo que lo tiene frenado; Bianca, una vez que entregue lo que le reclamamos y antes de que arranque el lanzamiento de los anillos; y Sol, para cerrar la oferta y el pricing. Aaron ya tiene la suya agendada para el viernes, donde arman el lanzamiento en vivo. Con Fede: Sebastián, después de las dos cartas, para el calendario de las cuatro semanas. Con Facu: Custom Lab el 2 de octubre."],["Sostener la regla de los 14 días","Entre una llamada y la siguiente de un mismo cliente van 14 días. Si una se corre, se corre la cadena entera, y eso se avisa antes y no después. La agenda de cada founder la arma ella directamente con Franco, con Fede y con el cliente."],["El acercamiento a los que se cierran","La regla es que el upsell se presenta entre 15 y 20 días antes de que termine el ciclo, nunca al cierre: cuando el ciclo se termina las ansiedades bajan y la persona está menos dispuesta a seguir invirtiendo. Para los nueve que cierran el 31 de octubre, eso cae entre el 11 y el 16 de octubre. Y hay dos caminos distintos: el upsell es para el que ya viene escalando y tiene que llegar a otro nivel; el retainer es para el que está estancado y necesita ser acelerado. Armar el proceso de cómo se contacta a cada uno: qué se le dice, cuál de los dos le corresponde y con cuánta anticipación."],["El roadmap del servicio y el de cada cliente","El recorrido general del programa por fechas —onboarding, Clarity Call con Facu, llamada con Franco y las grupales desde la semana uno— y el individual de cada cliente, que ya está escrito adentro de su documento."],["Los kick-offs de las grupales","Un video o documento por grupal —uno de Teo, uno de Juana, uno de Fede— que diga qué se trabaja ahí y con qué hay que llegar."],["Operaciones y oferta","Dentro de Founders, el frente que queda de su lado es operaciones y productividad, y la oferta, más el seguimiento de las tarjetas asignadas."]],"criterio":"Founders es <b>done with you</b>: se baja un paso a paso sobre el caso puntual y se acompaña la ejecución, pero la ejecución es del founder. No producimos contenido, no armamos el calendario, no escribimos los guiones. Lo que hay que calibrar antes de que entre alguien es una sola pregunta: qué expectativa tiene. Ahí se despeja el gris de la palabra personalizado.","filas":[{"nombre":"Cecilia Belotti","estado":"Sign off · cierra 16/09","proyecto":"Connect Turismo. Viene de los primeros clientes de F3 y entró sin audiencia ni contenido, así que el trabajo fue encontrar el vehículo. En septiembre el outreach produjo su primera propuesta: Tantasiña, USD 1.000, reservada hasta el viernes 19.","accionables":["<b>No se le manda el documento.</b> Lo presenta Teo en la llamada: es un informe para que se lo cuenten, no para que lo lea sola y saque conclusiones.","El documento de sign off lo completa Facu, que lo tomó el 16/9.","Coordinar la llamada de cierre con Teo. Es lo único que hay que hacer con este caso.","Preguntarle en qué quedó Tantasiña: la propuesta vence el <b>viernes 19</b> y el arranque propuesto es la semana del 22. Es el dato con el que Teo llega a la llamada.","Teo marcó que a Ceci <b>no</b> le pide el formulario de feedback: su perfil no es el que nutre al programa."],"doc":"cecilia-belotti.html","docn":"cecilia-belotti-cierre.html","extra":null,"nota":null,"slug":"cecilia-belotti","upselling":false},{"nombre":"Antonio Mazzello","estado":"Sign off · cierra 30/09","proyecto":"Marca personal — Banca Privada, Grupo IEB. El informe se reescribió entero: la marca pasa a apoyarse en un producto de IEB y no en su figura personal.","accionables":["Mandar el informe de cierre. <b>Es una versión nueva</b>, distinta de la que se armó en septiembre.","Coordinar el offboarding <b>con Teo</b>. Esta llamada no la hace Facu.","Antes de la llamada: responder el mensaje de Antonio que quedó sin contestar. Es lo primero.","Confirmar con Teo hasta qué fecha exacta mantiene el acceso a las grupales."],"doc":"antonio-mazzello.html","docn":"antonio-mazzello-cierre.html","extra":null,"nota":null,"slug":"antonio-mazzello","upselling":false},{"nombre":"Manuel Bruzzone","estado":"Sign off · cierra 30/09","proyecto":"Team Bruzzone. El sistema está diseñado hasta el último detalle; lo que nunca arrancó es la rutina que lo hace funcionar.","accionables":["Mandar el informe de cierre.","Coordinar la llamada de sign off con Teo y decirle en el mismo mensaje hasta cuándo tiene las grupales.","Preguntarle si la base de leads y las automatizaciones llegaron a implementarse: es el único dato que falta para cerrar el informe."],"doc":"manu-bruzzone.html","docn":"manu-bruzzone-cierre.html","extra":null,"nota":null,"slug":"manu-bruzzone","upselling":false},{"nombre":"Andrea Saturno","estado":"Sign off · cierra 30/09","proyecto":"Candela, la agencia que lleva con Sophie. Sale con las Onfire Sessions armadas y sin fecha.","accionables":["Mandar el informe de cierre.","Ofrecerle el sprint hasta fin de septiembre: grupales más <b>una llamada extra con Facu</b>. Agendar esa llamada.","Pedirle la fecha del viaje y, con eso, la fecha de la primera Onfire Session.","Tener presente que está mezclada con Franco: acá se da un poco de más.","Si Andrea pide la llamada extra de la semana del 15, coordinarla con Facu.","Avisarle a Franco antes de que Teo cierre el caso.","De la grupal de procesos del 17/9 quedó el <b>mapa de check-ins</b> para el jueves 24: dónde se inserta cada uno, qué pregunta, para qué se usa y dónde cae el dato."],"doc":"andrea-saturno.html","docn":"andrea-saturno-cierre.html","extra":null,"nota":null,"slug":"andrea-saturno","upselling":false},{"nombre":"Lucca Sorgoni","estado":"Upselling · cierra 30/09","proyecto":"Su programa B2C, que ya le da 10.000 dólares por mes, y su agencia de Airbnb, que sigue viviendo de referidos.","accionables":["Mandar el informe de cierre.","<b>Agendar primero la llamada con Franco para corregir la oferta.</b> Va antes del cierre, y es el único de los nueve con upsell abierto.","Recién después, coordinar con Teo la llamada: acá el sign off puede convertirse en upselling o en continuación.","Coordinar con <b>Franco</b> el testimonio y los próximos pasos como growth partner."],"doc":"lucca-sorgoni.html","docn":"lucca-sorgoni-cierre.html","extra":null,"nota":null,"slug":"lucca-sorgoni","upselling":"Sí. Es el único de los nueve. Cuando hable con Teo, ver de qué manera se gestiona."},{"nombre":"Sharon Palacio","estado":"Sign off · cierra 30/09","proyecto":"Estrategia creativa, y Sharon Tatt como proyecto aparte. Consiguió los clientes y entrega bien; lo único que nunca arrancó es su propio contenido.","accionables":["Mandar el informe de cierre.","Coordinar con Teo la llamada <b>en formato caso de éxito</b>, que es como se decidió cerrarla.","Capturar el testimonio en esa misma llamada.","Ofrecerle seguir entrando a las grupales como referente.","Confirmar con Facu cuántas llamadas uno a uno quedan antes del cierre y agendarlas (falta confirmar).","De la grupal de procesos del 17/9 quedó el <b>mapa de check-ins</b> para el jueves 24: dónde se inserta cada uno, qué pregunta, para qué se usa y dónde cae el dato."],"doc":"sharon-palacio.html","docn":"sharon-palacio-cierre.html","extra":null,"nota":null,"slug":"sharon-palacio","upselling":"Solo si decide lanzar su B2C: ahí entra cómo se arma y se estructura ese programa."},{"nombre":"Scarlett Montilla","estado":"Sign off · cierra 30/09","proyecto":"Mentoría de procesos. El proceso terminó en un pivote: de vender servicios técnicos de marketing a vender el proceso.","accionables":["Mandar el informe de cierre.","<b>El lanzamiento ya está bajado a 3 etapas</b>: workshop presencial en un mes, apertura de postulaciones a una mentoría grupal de 4 a 6 semanas, y uno a uno de validación. Está consiguiendo locación.","Agendar <b>una llamada más con Franco</b>: de ahí sale el precio de la mentoría, que es lo único que falta.","Recién después de esa llamada, coordinar el offboarding con Teo.","Bajó el ritmo de publicación por el rebranding. La salida que le dio Juana es documentar el propio rebranding.","De la grupal de procesos del 17/9 quedó el <b>mapa de check-ins</b> para el jueves 24: dónde se inserta cada uno, qué pregunta, para qué se usa y dónde cae el dato."],"doc":"scarlett-montilla.html","docn":"scarlett-montilla-cierre.html","extra":null,"nota":null,"slug":"scarlett-montilla","upselling":false},{"nombre":"Nicolás Lozada","estado":"Sign off · cierra 30/09","proyecto":"@f function valor(c,k){
  if(k==='nombre') return c.nombre;

  if(!c.h) return null;
  return k==='g'?c.h.g:c.h.e1[+k.slice(1)];

function ordenar(l){
  return l.sort(function(a,b){
    var x=valor(a,ORDEN.k), y=valor(b,ORDEN.k);
    if(x===null||y===null) return x===y?0:(x===null?1:-1);   // sin dato, siempre al final
    if(ORDEN.k==='nombre') return x.localeCompare(y,'es')*ORDEN.dir;
    if(x!==y) return (x<y?-1:1)*ORDEN.dir;
    return a.nombre.localeCompare(b.nombre,'es');
  });
}

function verCarta(id,titulo){ abrirVisor('cartas/'+id+'.html', titulo, 'carta-'+id+'.html') }
function abrirVisor(ruta,titulo,nombre){
  var v=$('#visor');
  v.querySelector('.vtit').textContent=titulo||'';
  v.querySelector('.vbaja').onclick=function(){guardarCarta(ruta,nombre)};
  v.querySelector('iframe').src=ruta;
  v.hidden=false; document.body.classList.add('viendo');
}
async function guardarCarta(ruta,nombre){
  var bt=$('#visor .vbaja'), antes=bt.textContent;
  bt.textContent='Guardando…';
  try{
    var r=await fetch(ruta); if(!r.ok) throw 0;
    var html=await r.blob();
    /* adentro del artifact la descarga pasa por la capability; en un sitio normal, por el navegador */
    var dl=null; try{ if(window.claude&&claude.use) dl=await claude.use('downloads'); }catch(e){}
    if(dl){ await dl.save({filename:nombre,data:html}); }
    else{
      var u=URL.createObjectURL(html), a=document.createElement('a');
      a.href=u; a.download=nombre; document.body.appendChild(a); a.click();
      a.remove(); setTimeout(function(){URL.revokeObjectURL(u)},4000);
    }
    bt.textContent='Listo';
  }catch(e){
    bt.textContent=(e&&e.code==='declined')?'Cancelado':'No se pudo';
  }
  setTimeout(function(){bt.textContent=antes},2600);
}
function cerrarCarta(){
  var v=$('#visor'); v.hidden=true; v.querySelector('iframe').src='about:blank';
  document.body.classList.remove('viendo');
}

function kEnvio(id,slug){return 'cf-env-'+id+'-'+(slug||'')}
