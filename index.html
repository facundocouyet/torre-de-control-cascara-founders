<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cáscara Founders</title>
<meta name="description" content="Torre de control de Cáscara Founders: la camada, el programa y la biblioteca.">
<meta name="theme-color" content="#0A0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Founders">
<style>
/* ============================================================
   CÁSCARA FOUNDERS · app
   La piel es de F3: tinta, papel cálido, etiqueta encajonada, radio 0.
   La respiración es de Cáscara: escala grande, aire, columnas anchas.
   Monocromo. El rojo de F3 está racionado: solo lo frenado y lo vencido.
   ============================================================ */
:root{
  --tinta:#171717; --tinta-deep:#0A0A0C; --tinta-warm:#1A1815;
  --papel:#ECEAE4; --papel2:#FBFAF8; --gris:#6A6A66; --gris2:#8E8B85;
  --tiza:#DBD7D2; --rojo:#FE1414;
  --disp:"Helvetica Now Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --edit:"Redaction 10","Redaction","Exposure","Times New Roman",Times,serif;
  --rail:252px; --gut:56px; --col:1080px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --tinta:#ECEAE4; --tinta-deep:#F7F5F1; --tinta-warm:#E4E1DA;
  --papel:#121211; --papel2:#1A1A18; --gris:#93908A; --gris2:#6E6B66;
  --tiza:#2C2C2A; --rojo:#FF4D4D;
}}
:root[data-theme="dark"]{
  --tinta:#ECEAE4; --tinta-deep:#F7F5F1; --tinta-warm:#E4E1DA;
  --papel:#121211; --papel2:#1A1A18; --gris:#93908A; --gris2:#6E6B66;
  --tiza:#2C2C2A; --rojo:#FF4D4D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--disp);
  font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-feature-settings:"kern" 1}
/* grano finísimo de papel, como en los informes */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.026;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--tinta);outline-offset:3px}
.num{font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.it{font-family:var(--edit);font-style:italic}

/* etiqueta encajonada — el motivo de F3, uno por vista */
.caja{display:inline-block;border:1px solid var(--gris2);padding:6px 13px;
  font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gris)}
.et{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gris)}

/* ---------- riel de navegación (escritorio) ---------- */
.riel{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:#0A0A0C;
  color:#FBFAF8;display:flex;flex-direction:column;padding:26px 0 26px;z-index:30;
  transition:width .18s ease}
.riel *{color:inherit}
.riel .marca{padding:0 22px 28px;border-bottom:1px solid rgba(236,234,228,.14);
  display:flex;align-items:center;gap:14px}
/* el sello: la caja de radio 0 con la F de Founders, el mismo motivo que la etiqueta de los documentos */
.riel .marca .sello-f{flex:0 0 auto;width:34px;height:34px;border:1.5px solid var(--papel2);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;
  letter-spacing:-.04em;line-height:1;padding-bottom:1px}
.riel .marca .txt{min-width:0}
.riel .marca b{display:block;font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.1;
  white-space:nowrap}
.riel .marca .txt span{display:block;font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(236,234,228,.42);margin-top:6px;white-space:nowrap}
.riel nav{display:flex;flex-direction:column;padding-top:8px}
.riel nav button{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:baseline;
  padding:15px 26px;color:rgba(236,234,228,.5);transition:color .12s}
.riel nav button .n{font-size:10.5px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.riel nav button .t{font-size:16px;letter-spacing:-.015em}
.riel nav button:hover{color:#FBFAF8}
.riel nav button[aria-selected="true"]{color:#FBFAF8}
.riel nav button[aria-selected="true"] .t{font-weight:700}
.riel nav button[aria-selected="true"]::before{content:"";position:absolute;left:0;width:3px;
  height:22px;background:#FBFAF8;margin-top:2px}
.riel nav button{position:relative}
.riel .pie{margin-top:auto;padding:22px 26px 0;border-top:1px solid rgba(236,234,228,.14)}
.riel .pie .f{font-size:10.5px;letter-spacing:.2em;color:rgba(236,234,228,.42)}
.riel .pie .s{font-family:var(--edit);font-style:italic;font-size:14px;
  color:rgba(236,234,228,.42);margin-top:8px;line-height:1.4}

/* plegar el riel */
.plegar{position:absolute;top:24px;right:-13px;width:26px;height:26px;background:#0A0A0C;
  border:1px solid #2A2A30;display:flex;align-items:center;justify-content:center;z-index:2}
.plegar i{width:7px;height:7px;border-left:1.5px solid #FBFAF8;border-bottom:1.5px solid #FBFAF8;
  transform:rotate(45deg);margin-left:3px;transition:transform .18s}
.plegar:hover{background:#17171A}
body.plegado .riel{width:58px}
body.plegado .riel .marca .txt,body.plegado .riel .pie,body.plegado .riel nav button .t{display:none}
body.plegado .riel .marca{padding:0 0 22px;justify-content:center;gap:0}
/* plegado, el botón baja para dejar respirar el sello */
body.plegado .plegar{top:auto;bottom:22px;right:-13px}
body.plegado .riel nav button{grid-template-columns:1fr;justify-items:center;padding:16px 0}
body.plegado .plegar i{transform:rotate(-135deg);margin-left:0;margin-right:3px}
/* al esconder la barra, el contenido queda centrado en la pantalla entera:
   el riel flota encima y el lienzo lleva el mismo aire de los dos lados */
body.plegado main{margin-left:0;padding:0 58px}
body.plegado .hoja{max-width:calc(var(--col) + 80px)}
@media (max-width:720px){.plegar{display:none} body.plegado .riel{width:auto}
  body.plegado .riel nav button .t{display:block} body.plegado main{margin-left:0;padding:0}}

/* ---------- lienzo ---------- */
main{margin-left:var(--rail);min-height:100%;position:relative;z-index:2;transition:margin-left .18s ease}
.hoja{max-width:var(--col);margin:0 auto;padding:0 var(--gut) 96px}
.encab{padding:56px 0 0;display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
.sello{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris2);
  text-align:right;line-height:1.7;white-space:nowrap}
h1.tit{font-size:clamp(40px,4.4vw,64px);font-weight:800;letter-spacing:-.038em;line-height:1;
  margin:26px 0 0;text-wrap:balance;max-width:22ch}
.entrada{font-size:22px;line-height:1.5;color:var(--gris);max-width:52ch;margin:20px 0 0}

/* banda de cifras: hairlines, sin cajas */
.banda{display:grid;grid-template-columns:repeat(4,1fr);margin-top:46px;
  border-top:1px solid var(--tinta);border-bottom:1px solid var(--tiza)}
.banda > *{padding:22px 26px 20px;border-left:1px solid var(--tiza);text-align:left}
.banda > *:first-child{border-left:0;padding-left:0}
.banda b{display:block;font-size:46px;line-height:.92;font-weight:800;letter-spacing:-.055em;
  font-variant-numeric:tabular-nums}
.banda span{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gris);margin-top:12px}
.banda button:hover b{color:var(--gris)}
.banda b.alerta{color:var(--rojo)}

h2.bl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gris);
  font-weight:400;margin:64px 0 0;padding-bottom:14px;border-bottom:1px solid var(--tinta);
  display:flex;justify-content:space-between;align-items:baseline;gap:16px}
h2.bl em{font-style:italic;font-family:var(--edit);text-transform:none;letter-spacing:0;
  font-size:15px;color:var(--gris2)}

/* ---------- filas de cliente ---------- */
.fila{display:grid;grid-template-columns:34px minmax(0,1fr) 130px 88px 150px 18px;
  gap:24px;align-items:center;width:100%;padding:20px 0;border-bottom:1px solid var(--tiza)}
.fila:hover{background:var(--papel2)}
.fila .idx{font-size:11px;color:var(--gris2);font-variant-numeric:tabular-nums}
.fila .nm{display:block;font-size:23px;font-weight:700;letter-spacing:-.026em;line-height:1.15}
.fila .sub{display:block;font-size:16.5px;color:var(--gris);margin-top:5px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .dia{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.fila .dia b{font-size:19px;letter-spacing:-.04em;display:block;color:var(--tinta);
  font-variant-numeric:tabular-nums;margin-bottom:3px}
.fila .dia.vencido b{color:var(--rojo)}
.fila .hc{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);text-align:right}
.fila .hc b{display:block;font-size:30px;letter-spacing:-.04em;color:var(--tinta);
  font-variant-numeric:tabular-nums;font-weight:800;margin-bottom:3px}
.fila .fl{width:9px;height:9px;border-right:1px solid var(--gris2);
  border-top:1px solid var(--gris2);transform:rotate(45deg)}

/* ritmo: tinta, no semáforo. Lleno / hueco / rojo racionado */
.ritmo{display:inline-flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gris);white-space:nowrap}
.ritmo i{width:10px;height:10px;flex:0 0 auto;border:1px solid var(--tinta)}
.ritmo.verde i{background:var(--tinta)}
.ritmo.amarillo i{background:transparent}
.ritmo.rojo{color:var(--rojo)}
.ritmo.rojo i{background:var(--rojo);border-color:var(--rojo)}

/* navegación del detalle: volver, anterior y siguiente */
.dtnav{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:22px 0 0;margin-bottom:6px}
.dtnav button{display:inline-flex;align-items:center;gap:11px;font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--gris);padding:9px 0}
.dtnav button:hover{color:var(--tinta)}
.dtnav button[disabled]{opacity:.3;cursor:default}
.dtnav .lados{display:flex;align-items:center;gap:26px;min-width:0}
.dtnav .nom{font-size:13px;letter-spacing:-.01em;text-transform:none;color:var(--tinta);
  max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtnav .pos{font-size:10.5px;letter-spacing:.16em;color:var(--gris2);font-variant-numeric:tabular-nums}
.pf{width:9px;height:9px;flex:0 0 auto;border-right:1.5px solid currentColor;
  border-top:1.5px solid currentColor;transform:rotate(45deg)}
.pf.izq{transform:rotate(-135deg)}
@media (max-width:720px){
  .dtnav{padding-top:14px;flex-wrap:wrap;gap:10px}
  .dtnav .nom{display:none}
  .dtnav .lados{gap:16px}
}

/* ---------- detalle ---------- */
.dt{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0 64px;align-items:start}
.dt-l{min-width:0}
.dt h1{font-size:clamp(38px,4.2vw,58px);font-weight:800;letter-spacing:-.04em;line-height:1;
  margin:24px 0 0;text-wrap:balance}
.dt .py{font-size:21px;color:var(--gris);margin:16px 0 0;max-width:46ch}
.dt .sellos{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.bloque{padding:28px 0;border-bottom:1px solid var(--tiza)}
.bloque p{margin:12px 0 0;font-size:22px;line-height:1.52;max-width:54ch}
.bloque .grande{font-size:clamp(24px,2.4vw,32px);font-weight:700;letter-spacing:-.028em;
  line-height:1.22;max-width:26ch;margin-top:14px}

/* lateral del detalle: el handicap y los días */
.aside{position:sticky;top:0;padding-top:120px}
.hcard{border-top:1px solid var(--tinta);padding-top:22px}
.hcard .t{display:flex;align-items:baseline;gap:12px}
.hcard .t b{font-size:66px;line-height:.85}
.hcard .t span{font-size:17px;color:var(--gris)}
.hcard .tr{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin-top:12px}
.ejes{margin-top:26px}
.ej{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;
  padding:11px 0;border-top:1px solid var(--tiza)}
.ej .n{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
.ej.f .n{color:var(--tinta);font-weight:700}
.ej .v{font-size:17px;color:var(--tinta);font-variant-numeric:tabular-nums;font-weight:700}
.ej .b{grid-column:1/-1;height:7px;background:var(--tiza);position:relative}
.ej .b i{display:block;height:100%;background:var(--tinta)}
.ej.f .b i{background:var(--rojo)}
.ej.e .n{color:var(--tinta)}
.hcard .sube{font-family:var(--edit);font-style:italic;font-size:16px;line-height:1.5;
  color:var(--gris);margin-top:20px;border-top:1px solid var(--tiza);padding-top:16px}

/* promedio de la camada por eje, en la vista del programa */
.ejeprom{display:grid;grid-template-columns:210px 64px minmax(0,1fr);gap:16px;align-items:baseline;
  border-top:1px solid var(--tiza);padding:18px 0}
.ejeprom .n{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta);font-weight:700}
.ejeprom .v{font-size:22px;color:var(--tinta);font-weight:700;font-variant-numeric:tabular-nums}
.ejeprom .bb{grid-column:1/-1;height:7px;background:var(--tiza);margin-top:4px}
.ejeprom .bb i{display:block;height:100%;background:var(--tinta)}
.ejeprom .q{font-size:18.5px;color:var(--gris);line-height:1.48}
@media (max-width:720px){
  .ejeprom{grid-template-columns:1fr auto;gap:6px 14px}
  .ejeprom .q{grid-column:1/-1}
}

/* la regla de los 90 días */
.dias{border-top:1px solid var(--tinta);padding-top:22px;margin-top:34px}
.dias .g{display:flex;align-items:baseline;gap:10px}
.dias .g b{font-size:52px;line-height:.9}
.dias .g span{font-size:15px;color:var(--gris)}
.dias .g b.vencido{color:var(--rojo)}
.dias .regla{height:6px;background:var(--tiza);margin-top:16px;position:relative;overflow:hidden}
.dias .regla i{display:block;height:100%;background:var(--tinta)}
.dias .regla i.vencido{background:var(--rojo)}
.dias .marcas{display:flex;justify-content:space-between;margin-top:8px;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris2)}
.dias .nota{font-family:var(--edit);font-style:italic;font-size:16px;color:var(--gris);margin-top:14px}

.check{margin:14px 0 0;padding:0;list-style:none}
.check li{display:grid;grid-template-columns:16px 1fr;gap:14px;padding:14px 0;
  border-top:1px solid var(--tiza);font-size:20px;line-height:1.45}
.check li::before{content:"";width:11px;height:11px;border:1px solid var(--gris2);margin-top:7px}
.check li b{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gris2);font-weight:400;margin-bottom:3px}

.boton{display:inline-flex;align-items:center;gap:14px;border:1px solid var(--tinta);
  padding:15px 22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:30px}
.boton:hover{background:var(--tinta);color:var(--papel)}
.boton.tinta{background:var(--tinta);color:var(--papel)}
.boton.tinta:hover{background:transparent;color:var(--tinta)}
.boton .fl{width:8px;height:8px;border-right:1px solid currentColor;border-top:1px solid currentColor;
  transform:rotate(45deg)}

/* ---------- filtros y buscador ---------- */
.barra{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:34px}
.busca{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--tinta);
  flex:1;min-width:240px}
.busca input{flex:1;font:inherit;font-size:20px;border:0;background:none;color:inherit;
  padding:11px 0;min-width:0}
.busca input::placeholder{color:var(--gris2)}
.filtros{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--tiza)}
.filtros button{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:11px 15px;
  color:var(--gris);border-right:1px solid var(--tiza)}
.filtros button:last-child{border-right:0}
.filtros button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}

/* ---------- acordeón ---------- */
.ac{border-bottom:1px solid var(--tiza)}
.ac summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto 20px;
  gap:20px;align-items:baseline;padding:24px 0;cursor:pointer}
.ac summary::-webkit-details-marker{display:none}
.ac summary:hover{background:var(--papel2)}
.ac .an{font-size:11px;color:var(--gris2);font-variant-numeric:tabular-nums}
.ac .at small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gris2);margin-bottom:7px}
.ac .at b{display:block;font-size:24px;font-weight:700;letter-spacing:-.026em;line-height:1.2}
.ac .c{font-size:20px;color:var(--gris);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.04em}
.ac .mas{width:14px;height:14px;position:relative;justify-self:end;margin-top:8px}
.ac .mas::before,.ac .mas::after{content:"";position:absolute;background:var(--gris2)}
.ac .mas::before{left:0;right:0;top:6px;height:1px}
.ac .mas::after{top:0;bottom:0;left:6px;width:1px;transition:transform .16s}
.ac[open] .mas::after{transform:scaleY(0)}
.ac .cuerpo{padding:0 0 30px 64px;max-width:62ch}
.ac .cuerpo p{margin:0 0 15px;font-size:21px;line-height:1.55;color:var(--gris)}
.ac .cuerpo p b{color:var(--tinta)}
.ac .cuerpo ul{margin:12px 0 0;padding-left:20px;color:var(--gris)}
.ac .cuerpo li{margin-bottom:9px;font-size:20px}
.ac .cuerpo .pieza{padding:16px 0;border-top:1px solid var(--tiza)}
.ac .cuerpo .pieza .ph{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.ac .cuerpo .pieza b{font-size:19px;color:var(--tinta);letter-spacing:-.02em}
.ac .cuerpo .pieza p{margin:7px 0 0;font-size:19px}

.pieza .pq{font-family:var(--edit);font-style:italic;color:var(--gris2);margin-top:8px}
.capas{margin-top:14px}
.capas summary{list-style:none;cursor:pointer;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gris);padding:10px 0;border-top:1px solid var(--tiza);
  white-space:nowrap;display:block}
.capas summary::-webkit-details-marker{display:none}
.capas summary:hover{color:var(--tinta)}
.capa{margin-top:14px}
.capa .ct{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gris2);margin-bottom:8px}
.capa ol{margin:0;padding-left:22px}
.capa li{font-size:18.5px;line-height:1.5;color:var(--gris);margin-bottom:8px}
.est{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:4px 9px;
  border:1px solid currentColor;white-space:nowrap;color:var(--gris)}
.est.falta{color:var(--rojo)}

.duenos{display:grid;grid-template-columns:repeat(3,1fr);gap:0 40px;margin-top:10px}
.duen{border-top:1px solid var(--tinta);padding:20px 0 26px}
.duen .dh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.duen .dh b{font-size:22px;font-weight:700;letter-spacing:-.024em}
.duen .dh span{font-size:24px;color:var(--gris);font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums}
.duen ul{margin:16px 0 0;padding:0;list-style:none}
.duen li{font-size:18px;line-height:1.42;margin-bottom:14px;color:var(--gris)}
.duen li b{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gris2);font-weight:400;margin-bottom:3px}
.duen .mas{font-family:var(--edit);font-style:italic;font-size:14.5px;color:var(--gris2)}

/* ---------- el mapa de cartas ---------- */
.porque{font-size:19px;line-height:1.5;color:var(--gris);max-width:60ch;margin:16px 0 6px}
.ac .cuerpo .res{font-size:22px;line-height:1.45;color:var(--tinta);margin:0 0 4px;max-width:56ch}
.cbl{margin-top:24px}
.cbl .ct{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gris2);margin-bottom:10px}
.cbl p{margin:0;font-size:19px;line-height:1.5;color:var(--gris);max-width:60ch}
.cbl ol,.cbl ul{margin:0;padding-left:22px}

.acc{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.acc .boton{margin-top:26px}
.envio{margin-top:26px;border-top:1px solid var(--tinta);padding-top:24px}
.envio .eh{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin-bottom:18px}
.envio label{display:block;margin-bottom:20px}
.envio label span{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gris2);margin-bottom:8px}
.envio select,.envio textarea{width:100%;font:inherit;font-size:18px;line-height:1.45;color:inherit;
  background:var(--papel2);border:1px solid var(--tiza);padding:12px 14px;border-radius:0}
.envio textarea{min-height:78px;resize:vertical}
.envio select:focus,.envio textarea:focus{outline:none;border-color:var(--tinta)}
.envio .fila{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.envio .nota{font-family:var(--edit);font-style:italic;font-size:15px;color:var(--gris2);margin:4px 0 0}
.envio .aviso{font-size:16px;color:var(--gris);margin-top:14px}
.envio .aviso.mal{color:var(--rojo)}
@media (max-width:720px){.envio .fila{grid-template-columns:1fr}}

.vacio{padding:60px 0;font-family:var(--edit);font-style:italic;font-size:19px;color:var(--gris2)}
.vista{display:none}.vista.on{display:block}
.topmov{display:none}

ras","t":"Onboarding con Teo","x":"Se dispara con la confirmación de pago: contrato, alta, entrega de materiales y recordatorio de formularios a las 48 y 96 horas. Teo crea la ficha en Cuentas, el OS del cliente, el grupo de WhatsApp y el acceso a la app. El founder completa diagnóstico, números, oferta y Founder Insights. Se le explica cómo consumir el programa, el mapa de mentores y el modelo de conducta."},{"n":"02","c":"Semana 1","t":"Las tres grupales y la Clarity Call con Facu","x":"Arranca con la grupal de Teo (bienvenida, setup y calendario), sigue la de Juana (definición de audiencia) y la de Fede (línea editorial y ángulos). Cierra con la Clarity Call de Facu: diagnóstico, cuello de botella y prioridad de ataque. Facu lee antes todos los Founder Insights y formularios. Sin formularios completos no hay Clarity Call: el día 5 escala Teo y el día 7 se corre la llamada. De ahí salen las conclusiones que van a Franco."},{"n":"03","c":"Semana 2","t":"Producto, oferta y lanzamiento con Franco","x":"El founder llega con el formulario de construcción de oferta respondido: 40 preguntas en 8 bloques sobre resultado, paso a paso, módulos, cliente y precio. Sale el one-pager de oferta con el ICP. La arquitectura que se baja es asesoría paga única y diagnóstica que se acredita a la consultoría, la consultoría de 90 días como oferta principal y única pública, y el DFY arriba como upsell. Se valida con precio, nunca gratis."},{"n":"04","c":"Semana 3","t":"Selección de foco con Facu","x":"Se elige una sola orientación con tres preguntas en orden de prioridad: ¿llegan y cierran consultas?, ¿la demanda depende de su energía?, ¿la entrega le come el tiempo? La primera negativa define la ruta y ante empate se va hacia lo más cerca del dinero. La decisión es de Facu."},{"n":"05","c":"Fin del mes 1","t":"Radiografía y roadmap","x":"Se junta todo lo que hubo con esa persona (llamadas, propuestas enviadas, Founder Insights, updates de WhatsApp) y se escribe un solo documento: punto A con hechos, lectura del caso con un único cuello de botella, punto B medible con fecha, qué pasó hasta hoy, qué salió bien y qué no contra la métrica declarada, y el roadmap de 8 semanas de esa orientación con objetivo y entregable por semana. Los compromisos quedan de los dos lados, con fecha y responsabilidad 50/50 explícita. Crear contenido es condición para entrar al mes 2."},{"n":"06","c":"Mes 2 · cuatro sesiones 1:1","t":"El servicio","x":"Cuatro uno a uno alternadas: oferta y pricing con Franco, estructura de entrega con Facu, adquisición y ventas con Franco, y cierre de mes 2 con Facu. Las tres grupales siguen corriendo; lo que termina acá es la presencia de Facu y Franco en grupales, que pasan a atender solo uno a uno."},{"n":"07","c":"Mes 3 · tres sesiones 1:1","t":"El cierre","x":"Apertura del mes 3 con Franco, ejecución sobre el foco con Facu, y cierre, sign-off y roadmap a 6 meses con Teo. En el cierre se suma el paquete de entregables que el founder ejecuta solo y la recomendación: renovar con módulo, pasar a growth partner u offboarding como caso de éxito con testimonio."},{"n":"08","c":"Los 90 días · transversal","t":"Diez uno a uno y trece semanas de grupales","x":"En total son 10 sesiones uno a uno por founder: tres en el mes 1, cuatro en el mes 2 y tres en el mes 3, con tema, fecha y mentor definidos desde el día 1. Cinco de esas diez son de Facu. Las tres grupales corren las trece semanas sin interrupción y hay un encargado del equipo siguiendo la evolución de forma continua. Con 16 cupos son 80 sesiones por camada."}],"orientaciones":[{"n":"Conseguir","l":"Franco","x":"Se trabaja la oferta, el pricing y el proceso de ventas. El resultado a 60 días son los primeros cierres con el sistema nuevo. En el handicap es la ruta que marcan los ejes de Oferta y de Venta cuando alguno de los dos es el más bajo.","m":["Lista de 50 prospectos","Guion de outreach probado","20 conversaciones abiertas","5 propuestas enviadas","Pipeline corriendo"]},{"n":"Sostener","l":"Fede","x":"Se trabaja contenido, audiencia y delegación de la producción. El resultado a 60 días es un ritmo de publicación que se sostiene solo. En el handicap es la ruta que marcan los ejes de Contenido y de Demanda.","m":["Línea editorial escrita","3 ángulos definidos","Calendario de 60 días cargado","4 semanas publicando sin cortar","Primera contratación"]},{"n":"Entregar","l":"Facu","x":"Se trabaja el proceso de servicio, la capacidad y el equipo. El resultado a 60 días es la misma entrega con menos horas propias. En el handicap es la ruta que marca el eje de Entrega.","m":["Mapa de servicio con horas reales","Proceso de entrega documentado","Template de onboarding de cliente","Informes de entrada y de cierre","Primera contratación","Capacidad y precios definidos"]}],"grupales":[{"n":"Operaciones","q":"Teo","c":"Martes 15:00","x":"Sistemas, entrega y herramientas. En la semana 1 es la de bienvenida, setup y calendario. Trece temas rotativos a lo largo de las trece semanas."},{"n":"Creatividad","q":"Juana","c":"Jueves 15:00","x":"Identidad, dirección visual y voz de marca. En la semana 1 se define la audiencia. Trece temas rotativos."},{"n":"Contenido","q":"Fede","c":"Viernes 16:30","x":"Línea editorial, ángulos, formatos y ritmo. Trece temas rotativos. Los viernes hay veinte minutos de coordinación del equipo."},{"n":"Cómo corre cada sesión","q":"Las tres iguales","c":"Las trece semanas, sin interrupción","x":"Abre con el marcador de la sesión anterior y el checklist exigido. Revisa ejecución sobre material real de dos o tres participantes. Enseña el tema de la rotación. Crea algo en vivo en la llamada. Deja inspiración: tres ideas y una referencia. Y cierra con un desafío que ya está en el checklist de la orientación. Hay una sola inscripción por sesión, los mentores leen las inscripciones previas y los conflictos escalan a Facu. Dónde y quién gestiona la inscripción a las grupales (falta confirmar)."}],"mentores":[{"n":"Facu","r":"Estructura y negocio. Toma la Clarity Call, la selección de foco, la estructura de entrega, el cierre de mes 2 y la ejecución sobre el foco: cinco de las diez sesiones.","si":"Procesos, equipo, delegación, management y priorización.","no":"Creatividad y contenido."},{"n":"Franco","r":"Oferta, precio y ventas. Toma producto y oferta en la semana 2, oferta y pricing y adquisición en el mes 2, y la apertura del mes 3.","si":"Growth, monetización, oferta, pricing, ventas y escala.","no":"Detalles de ejecución y herramientas de diseño."},{"n":"Fede","r":"Contenido. Lleva la grupal de contenido y es el dueño de la orientación Sostener junto a la línea editorial y los ángulos.","si":"Narrativa, ángulos, calendario y mensaje.","no":"Pricing y estructura societaria."},{"n":"Juana","r":"Creatividad. Lleva la grupal de creatividad y la definición de audiencia de la semana 1.","si":"Identidad, dirección visual y voz de marca.","no":"Ventas y operaciones."},{"n":"Teo","r":"Operaciones. Toma el onboarding de las primeras 48 horas, la grupal de operaciones y el cierre con sign-off y roadmap a 6 meses.","si":"Sistemas, entrega, herramientas y fulfillment.","no":"Oferta y posicionamiento."}],"bloques":[{"n":"La oferta y lo comercial","piezas":[{"t":"Presentación","q":"La oferta en 16 slides. Es la pieza para presentar el programa en una llamada o para mandar antes de una reunión.","e":"listo","f":["HTML"],"u":"https://facundocouyet.github.io/aceleradora/presentacion.html"},{"t":"Informe completo","q":"El documento maestro: los principios, los cinco frentes, el mapa de mentores, la rotación de 13 semanas, la anatomía de una grupal, la camada 1, el lanzamiento, los checklists por orientación y los puntos abiertos. Manda sobre el resto.","e":"listo","f":["HTML"],"u":"https://facundocouyet.github.io/aceleradora/informe.html"},{"t":"La oferta al cliente","q":"Qué incluye el programa, el roadmap sesión por sesión, las tres orientaciones, los founders, los bonus y la inversión. Se ve en el navegador, se descarga como HTML o se imprime en PDF.","e":"listo","f":["HTML","HTML descargable","PDF"],"u":"https://facundocouyet.github.io/aceleradora/oferta.html"},{"t":"Pitch deck","q":"Figura como sección 03 de la plataforma pero no tiene archivo propio: los botones que están debajo llevan a la oferta al cliente. Hay que definir si es una pieza aparte o si el nombre sobra.","e":"falta escribir","f":[],"u":""},{"t":"Planificador de calendario","q":"Herramienta interactiva para armar el calendario de la camada: 13 alumnos, tres franjas, 13 semanas más las 1:1, con el roadmap desplegable. La usa Teo, no va a diseño.","e":"listo","f":["HTML"],"u":""},{"t":"Tabla de triage de clientes F3","q":"Quién entra a Founders, quién no y a quién se le ofrece un upsell. Está armada como hipótesis y la tiene que corregir Teo.","e":"en borrador","f":["Markdown"],"u":""}]},{"n":"Los documentos de cliente","piezas":[{"t":"Radiografías con roadmap · once clientes","q":"Aaron, Agostina, Bianca, Custom Lab, José David, Lola, Lucio, Matías, Sebastián, Sofía y Sol. Siguen en el programa: septiembre para dejar todo armado, octubre para ver la evolución, cierre el 31 de octubre. Falta revisarlos antes de mandarlos.","e":"en borrador","f":["HTML","PDF"],"u":""},{"t":"Informes de cierre · ocho clientes","q":"Andrea, Antonio, Ayelén, Lucca, Manu, Nicolás, Scarlett y Sharon. Cierra el proceso y deja los próximos sesenta días escritos para que los ejecuten solos. Las llamadas de sign-off las hace Teo. Falta revisarlos antes de mandarlos.","e":"en borrador","f":["HTML","PDF"],"u":""},{"t":"Qualita · Radiografía y roadmap de retoma","q":"Primera corrida de la skill de radiografía. Está entregada y esperando la decisión de Rafa.","e":"listo","f":["Markdown","Canvas"],"u":""},{"t":"Qualita · Roadmap Cáscara Founders","q":"Catorce paneles en el formato oficial de roadmap de cliente. Es la referencia visual para los que vengan.","e":"listo","f":["Canvas"],"u":""},{"t":"Formulario de construcción de oferta","q":"Cuarenta preguntas en ocho bloques: resultado, paso a paso, módulos, cliente y precio. Se le manda al founder antes del 1:1 con Franco. Activo reutilizable para toda la camada.","e":"listo","f":["Markdown"],"u":""},{"t":"Briefing de clarity call","q":"Una carilla antes de la llamada: el problema en una línea, síntoma contra problema real, la métrica del trimestre, los activos y los vacíos, y dos o tres tensiones para abrir. Ya se hizo para Sebastián, beMOTION y Sofía.","e":"listo","f":["Markdown"],"u":""},{"t":"Paquete de entregables de cierre","q":"Lo que el founder se lleva para ejecutar solo. El modelo probado es el de Ceci: auditoría de producto e instrumentación de la plataforma, estructura y copy de landing, calendario de contenido repetible y playbook de outreach en frío con templates.","e":"listo","f":["Markdown"],"u":""},{"t":"Handoff de diseño de la radiografía","q":"El formato con el que se maqueta cada documento: header con la métrica, timeline continuo con las 1:1 y la banda de acompañamiento async, checklist de reuniones, bloque de oferta y pipeline.","e":"listo","f":["Markdown"],"u":""}]},{"n":"Los contratos","piezas":[{"t":"Contrato de Cáscara Founders","q":"No existe. Hoy se firma con el template del programa B2C, prestado. Es el primer pendiente de la lista del informe maestro.","e":"falta escribir","f":[],"u":""},{"t":"Template de contrato B2C","q":"El contrato del programa B2C. Es el que se usa mientras no esté el propio de la aceleradora.","e":"listo","f":[],"u":""},{"t":"Prompt maestro de generación de contratos","q":"Datos de la entidad, el template y un bloque de pedido por propuesta. Genera el contrato a partir de la propuesta comercial.","e":"listo","f":["Markdown"],"u":""},{"t":"Acuerdo de growth partner","q":"El modelo para los casos de nivel 3: rev share sobre profit neto, waterfall de comisiones, costos directos y split. Regla fija: el acuerdo interno y el acuerdo con el cliente van siempre separados.","e":"listo","f":["Markdown","PDF"],"u":""},{"t":"Briefing legal de growth partner","q":"Qué es un growth partner y cómo se calcula el profit, escrito para que lo lea el abogado. Hecho para MySaint y para Daniella Aiello.","e":"listo","f":["PDF"],"u":""},{"t":"Contrato de partnership · Delfina Ferro","q":"Treinta y seis artículos redactados completos, con notas de redacción para legales. Está esperando la revisión legal.","e":"en borrador","f":["Word"],"u":""}]},{"n":"Los procesos internos","piezas":[{"t":"Proceso de consultoría de founders","q":"Cómo se atiende a un founder de punta a punta: el día 0 de onboarding, la cadena de accionables semana por semana, las diez llamadas 1:1, las tres orientaciones, la radiografía, la anatomía de una grupal y la cuenta de capacidad. Es el documento que hay que leer primero.","e":"listo","f":["Markdown"],"u":""},{"t":"Checklists por orientación","q":"Qué tiene que estar hecho en Conseguir, en Sostener y en Entregar, más el piso común a las tres al día 90. Van como anexo del informe maestro.","e":"listo","f":["HTML"],"u":"https://facundocouyet.github.io/aceleradora/informe.html"},{"t":"Mapa de mentores","q":"Qué le lleva el founder a cada uno y qué no. Franco, Facu, Fede, Juana y Teo, con los cinco frentes repartidos.","e":"listo","f":["HTML","Markdown"],"u":""},{"t":"Inventario de producción","q":"Todo lo producido por fecha, título y versión, con dónde vive y en qué estado está. Se le agrega una fila al terminar cualquier entregable.","e":"listo","f":["Markdown"],"u":""},{"t":"Índice del sistema","q":"Qué documento sirve para qué y en qué orden se leen. Las reglas del sistema están acá: un paso abierto por día, cada entregable al inventario con versión, las decisiones de proceso se escriben y no quedan en un chat.","e":"listo","f":["Markdown"],"u":""},{"t":"Repaso de clientes · Teo y Facu","q":"La charla del 2 de septiembre pasada a documento. De ahí salieron los diecinueve documentos de cliente, los módulos por categoría y las decisiones de proceso.","e":"listo","f":["HTML","Notion"],"u":""},{"t":"Roadmap de automatización","q":"Qué se automatiza, con qué herramienta y en qué fase. Es el documento que se lee para elegir el próximo paso.","e":"listo","f":["Markdown"],"u":""},{"t":"Padrón de clientes","q":"El cruce de las dos bases de clientes de Notion: quién tiene ficha, quién está desalineado y qué duplicados hay. Se lee antes de dar una lista de clientes por cerrada.","e":"listo","f":["Markdown","Notion"],"u":""},{"t":"Plantilla de paneles de founders","q":"El generador del formato oficial de paneles, 1920 por 1080, para presentar roadmaps de clientes. Se cambia el contenido, se corre y se publica.","e":"listo","f":["Script","HTML"],"u":""},{"t":"Handoffs de chats y de diseño","q":"Lo que quedó de 137 chats de trabajo y 47 de diseño: qué se produjo, qué se decidió, los números y los pendientes. Se busca acá antes de rehacer algo.","e":"listo","f":["Markdown"],"u":""}]}],"modulos":[{"c":"Mirada de negocio","porque":"La camada llega con muchos frentes abiertos y sin un punto A escrito, y sin eso cada llamada arranca discutiendo qué hay que hacer.","items":[{"id":"radiografia-360","t":"360 del negocio: punto A, cuello de botella y punto B","x":"Un documento de dos carillas con los números de hoy, un solo cuello de botella nombrado y un punto B con fecha.","e":"existe","q":"Se le asigna a todo founder en el primer mes, antes de tocar oferta o contenido.","ej":["oferta","contenido","demanda","venta","entrega"],"p":["Juntar en una carpeta todo lo que existe: ventas de los últimos 90 días, precios cobrados, piezas publicadas, clientes activos y horas propias por semana.","Escribir el punto A con hechos: qué vendió, a qué precio, qué produce y qué tiene armado.","Puntuar los cinco ejes de cero a cuatro con la escalera del handicap, apoyando cada número en una evidencia concreta.","Marcar el eje más bajo y escribir el cuello de botella en una sola frase.","Fijar el punto B: un número, una fecha y cómo se va a medir.","Elegir la métrica del trimestre y dejarla en el encabezado del documento, a la vista."],"cc":["La planilla de punto A con ventas, precios y clientes de los últimos 90 días","La grilla de los cinco ejes con la evidencia de cada número","La frase del cuello de botella y la del punto B con fecha"],"hh":["Notion (página de radiografía del founder)","Google Sheets para el punto A"]},{"id":"foco-y-ventana","t":"Elegir la ventana y soltar el resto","x":"Una hoja con la ventana elegida, la fecha en el calendario y la lista de lo que queda en pausa hasta esa fecha.","e":"falta","q":"Cuando el founder tiene tres o cuatro frentes abiertos y avanza poco en todos.","ej":["oferta","demanda"],"p":["Listar todos los frentes abiertos hoy, incluidos los proyectos personales y los eventos ya comprometidos.","Marcar al lado de cada uno la fecha real y qué resultado deja si sale bien.","Elegir una sola ventana, la más cerca del dinero, y ponerle fecha de inicio y de cierre.","Escribir qué queda en pausa hasta esa fecha, con nombre y apellido de cada cosa.","Avisarle a las personas involucradas en lo que queda en pausa.","Bloquear en el calendario las horas semanales que vive esa ventana."],"cc":["La lista de frentes abiertos con fecha y resultado esperado","La hoja de la ventana elegida con fecha de inicio y de cierre","La lista de pausas con los avisos hechos"],"hh":["Google Calendar","Notion (tablero de foco del trimestre)"]},{"id":"sociedad-y-roles","t":"Resolver la sociedad que frena","x":"Una hoja de acuerdo con quién resuelve qué, cómo se reparte la plata y con qué aviso se sale, conversada con la otra parte.","e":"falta","q":"Cuando hay una socia, un socio o una estructura compartida que le come tiempo y decisión al proyecto propio.","ej":["entrega","oferta"],"p":["Escribir qué resuelve cada socio hoy en cada cliente y en cada tarea, tal como pasa.","Marcar las tareas que hacen los dos y las que no hace nadie.","Poner los números arriba de la mesa: qué entra, qué sale y cuánto retira cada uno.","Definir el reparto y el aviso de salida por escrito, con revisión trimestral del aporte de cada uno.","Tener la conversación de fondo con la otra parte, informando la decisión tomada.","Dejar el acuerdo firmado o confirmado por escrito y guardarlo donde los dos lo vean."],"cc":["El cuadro de quién resuelve qué, socio por socio","Los números de ingresos, egresos y retiros de los últimos tres meses","La hoja de acuerdo con reparto, aviso y revisión trimestral"],"hh":["Notion (documento de acuerdo entre socios)","Google Sheets para el reparto"]}]},{"c":"Oferta y precio","porque":"Casi toda la camada sabe explicar lo que hace y no lo tiene escrito con cliente, promesa y precio, y ese es el eje más bajo del handicap en la mayoría de los casos.","items":[{"id":"icp-mecanismo","t":"ICP del mecanismo que vendés","x":"Una hoja con el cliente ideal escrito: quién es, en qué momento está, qué problema tiene y con qué palabras lo cuenta.","e":"parcial","q":"Cuando el founder describe a su cliente por rubro o por tamaño y todavía no por el problema que le resuelve el mecanismo.","ej":["oferta"],"p":["Listar los últimos diez clientes o consultas y anotar qué compró cada uno y por qué.","Quedarse con los tres que dejaron mejor resultado y buscar qué tienen en común.","Escribir el cliente ideal en una frase que incluya momento del negocio, problema y presupuesto.","Anotar los dolores con las palabras textuales que usa el cliente, sacadas de mensajes y llamadas.","Definir la subcategoría donde se posiciona el mecanismo, para dejar de competir por precio.","Descartar por escrito los nichos que quedan afuera del tramo."],"cc":["El formulario de ICP y dolores con las palabras textuales del cliente","La tabla de los últimos diez clientes o consultas con motivo de compra","La frase del cliente ideal y la subcategoría elegida"],"hh":["Notion (base de clientes y consultas)","Formulario de ICP y dolores de Cáscara"]},{"id":"one-sheeter-oferta","t":"One-sheeter de la oferta","x":"Una hoja con la promesa, el resultado escrito en número, el paso a paso de la entrega, los entregables y el plazo.","e":"parcial","q":"Cuando la oferta vive en la cabeza del founder y cada conversación de venta la explica distinto.","ej":["oferta"],"p":["Completar el formulario de construcción de oferta de 40 preguntas antes de la sesión.","Escribir la promesa en una frase, con el resultado en número y el plazo en el que se mide.","Bajar el paso a paso de la entrega en etapas, con el entregable de cada una.","Listar qué incluye, qué queda afuera y qué necesita del cliente para que funcione.","Cerrar los módulos de la oferta y decidir cuáles se venden juntos y cuáles por separado.","Pasar la hoja a una sola página presentable y probarla en una conversación real."],"cc":["El formulario de construcción de oferta de 40 preguntas","La hoja de promesa, resultado en número, plazo y paso a paso","La lista de incluye, no incluye y requisitos del cliente"],"hh":["Formulario de construcción de oferta (40 preguntas, 8 bloques)","Notion (página de oferta)","Canva o Claude Design para la hoja presentable"]},{"id":"precio-escalera","t":"Precio y escalera de valor","x":"La tabla de precios de cada nivel con la forma de pago, y el orden en que se comunica cada uno.","e":"parcial","q":"Cuando el founder cobra por debajo de lo que entrega, o cuando quiere sumar un producto arriba o abajo de lo que ya vende.","ej":["oferta","venta"],"p":["Calcular el costo real de entregar una vez: horas propias, equipo, herramientas y producción.","Poner el piso en el costo por dos y comparar contra lo que se cobra hoy.","Definir la escalera: entrada, oferta principal y lo que va arriba, con el resultado de cada nivel.","Fijar la forma de pago: precio de lista, precio pagando por adelantado y precio en dos cuotas, con más de la mitad cobrada al principio.","Decidir qué nivel se comunica en público y cuál se ofrece adentro de la llamada.","Presentar el precio nuevo en al menos una propuesta real y anotar la reacción."],"cc":["La planilla de costo de entrega por cliente","La tabla de escalera con precio, resultado y forma de pago de cada nivel","La regla de que se comunica y que se guarda para la llamada"],"hh":["Google Sheets (costo de entrega y escalera)","Notion (página de pricing)","Stripe o link de pago para el cobro por adelantado"]},{"id":"cinco-llamadas-con-precio","t":"Las primeras cinco llamadas con precio","x":"Cinco llamadas hechas con el precio dicho, cada una con la objeción anotada y la corrección que sale de ahí.","e":"parcial","q":"Cuando la oferta ya está escrita y el founder todavía no la puso arriba de la mesa con un número.","ej":["venta","oferta"],"p":["Elegir cinco personas del entorno que entren en el cliente ideal escrito.","Presentar la oferta completa con el precio, sin descuentos y sin versiones gratis.","Grabar cada llamada y anotar en qué momento aparece la objeción.","Registrar la objeción textual de cada una en la misma planilla.","Corregir la promesa, el precio o el cliente ideal con lo que salió de las cinco.","Cerrar la hipotesis de precio con el número que sostuvo más conversaciones."],"cc":["La lista de las cinco personas con fecha de llamada","La planilla de objeciones textuales llamada por llamada","La corrección escrita de la oferta después de las cinco"],"hh":["Google Meet o Zoom con grabación","Google Sheets (planilla de objeciones)","Calendly"]}]},{"c":"Contenido y marca","porque":"La mitad de la camada publica sin criterio que una las piezas, y la otra mitad tiene el criterio y no sostiene el volumen.","items":[{"id":"profile-funnel","t":"Profile funnel del perfil","x":"El perfil acomodado: descripción, destacadas, contenido anclado y archivo, de manera que en quince segundos se entienda quién es y qué vende.","e":"existe","q":"Se le asigna a todo founder antes de que salga la primera pieza del tramo.","ej":["contenido","demanda"],"p":["Escribir la descripción con quién es, a quién le sirve y qué hacer ahora.","Armar las destacadas: la historia, el servicio, los casos y cómo contactar.","Anclar las tres piezas que mejor explican la oferta.","Archivar las publicaciones repetidas y las que hablan de otra cosa.","Pasar la cuenta a profesional y revisar el enlace de contacto.","Mandar el perfil a tres personas de afuera y preguntarles qué entendieron."],"cc":["El checklist del SOP de profile funnel, punto por punto","El texto de la descripción y los titulos de las destacadas","La devolución de las tres personas que miraron el perfil"],"hh":["Instagram (cuenta profesional)","SOP de profile funnel de Cáscara","Canva para las portadas de destacadas"]},{"id":"angulos-desde-icp","t":"Ángulos de comunicación bajados del ICP","x":"Una lista de ocho a doce ángulos, cada uno con una idea concreta y un guion de ejemplo al lado.","e":"parcial","q":"Cuando el founder tiene la oferta escrita y cada pieza arranca de una hoja en blanco.","ej":["contenido"],"p":["Tomar los dolores del ICP y convertir cada uno en una pregunta que el cliente ya se hace.","Escribir un ángulo por dolor, con el giro propio que lo vuelve reconocible.","Bajar una idea concreta por ángulo: qué se muestra, en qué formato y con qué cierre.","Escribir un guion de ejemplo completo para el ángulo más fuerte.","Ordenar los ángulos por cercanía a la venta y elegir los tres del primer mes.","Cargar los ángulos en el calendario y publicar contra ellos."],"cc":["La tabla de ángulos con dolor, idea concreta y formato","El guion de ejemplo del ángulo principal","Los tres ángulos elegidos para el primer mes"],"hh":["Notion (base de ángulos e ideas)","Hoja de frases propias del founder"]},{"id":"calendario-contenido","t":"Calendario de contenido de sesenta días","x":"Un calendario de sesenta días cargado, con cadencia semanal, formato y ángulo en cada tarjeta.","e":"parcial","q":"Cuando el founder publica cuando le queda tiempo y la cadencia se cae sola.","ej":["contenido"],"p":["Definir la cadencia real que puede sostener: cantidad de piezas la producción propia es tan cara o tan pulida que el volumen se cae.","ej":["contenido"],"p":["Revisar qué piezas propias funcionaron y con qué nivel de producción salieron.","Elegir un formato de bajo costo: entrevista cruda con alguien preguntando, video largo sin guion, o el trabajo real con voz en off.","Definir el setup fijo: lugar, luz, cámara, duración y quién pregunta.","Fijar el nivel de edición y el techo de costo por pieza.","Grabar y publicar dos piezas con ese formato, sin libreto.","Dejar escrito el formato como estándar para las próximas diez."],"cc":["La hoja del formato con setup, duración y quién pregunta","El techo de costo por pieza y el nivel de edición","Las dos primeras piezas publicadas con ese formato"],"hh":["Camara de celular","Editor de nivel uno (clipeo, subtitulos, color)","Tarifario de edición de Cáscara"]},{"id":"caso-documentado","t":"El caso documentado del cliente que ya tenés","x":"Dos o tres fichas de caso con números antes y después, y el registro en video o foto del proceso.","e":"parcial","q":"Cuando el founder ya entregó resultados y no tiene con qué probarlos frente a un cliente nuevo.","ej":["contenido","venta"],"p":["Elegir los clientes con resultado medible y pedirles permiso para documentar.","Juntar los números de entrada y los de salida, con fecha de cada medición.","Grabar o fotografiar el proceso mientras pasa, sin esperar el cierre.","Escribir la ficha: punto de partida, qué se hizo, qué cambió y en cuánto tiempo.","Pedirle al cliente una frase corta sobre el cambio.","Usar la ficha adelante en la prospección y en el contenido."],"cc":["La lista de clientes con resultado medible y permiso confirmado","Los números antes y después de cada caso","Las fichas escritas con la frase del cliente"],"hh":["Notion (base de casos)","Canva o Claude Design para la ficha","Google Sheets con los números del caso"]}]},{"c":"Demanda y comunidad","porque":"Varios founders tienen tráfico o gente reunida y nada armado que lleve de la atención a la conversación.","items":[{"id":"arquitectura-comunidad","t":"Arquitectura minima de una comunidad","x":"La comunidad con su arquitectura corriendo: ritual de bienvenida, un reto por mes, curaduría de recursos y el registro de quién participa.","e":"parcial","q":"Cuando el founder tiene gente reunida en un grupo o una lista y adentro no pasa nada.","ej":["demanda","entrega"],"p":["Definir para qué existe la comunidad y qué hace la gente adentro cada semana.","Instalar el ritual de bienvenida y la respuesta a cada presentación.","Armar el calendario de dinamicas: llamada mensual, un reto por mes, curaduría de recursos y premios por participación.","Definir cómo se llena: qué contenido de YouTube y de redes baja tráfico al grupo y con qué motivo.","Registrar quién participa y quién compra, para identificar al buyer que ya está adentro.","Leer una vez por mes qué parte de las ventas salió de la comunidad."],"cc":["El calendario de dinamicas del mes","El texto del ritual de bienvenida","La base de miembros con participación y compras"],"hh":["WhatsApp (comunidad)","Notion o Airtable (base de miembros)","Skool si el producto es formativo"]},{"id":"handraisers-historias","t":"Historias con handraisers","x":"Una secuencia de historias corriendo que levanta manos y deriva cada mano a una conversación registrada.","e":"parcial","q":"Cuando el founder publica y no tiene un mecanismo que convierta la atención en conversación.","ej":["demanda","venta"],"p":["Elegir el contenido que ya está caliente y montar la secuencia arriba de eso.","Escribir la secuencia: contexto, problema, prueba y la pregunta que levanta la mano.","Definir el mecanismo de respuesta: palabra clave, encuesta o pregunta directa.","Publicar la secuencia el mismo día que el contenido que la alimenta.","Derivar cada mano levantada a una conversación, con un mensaje escrito de antemano.","Registrar cada mano en el pipeline con motivo y próxima acción."],"cc":["El guion de la secuencia de historias, placa por placa","El mensaje de derivación escrito","El registro de manos levantadas y conversaciones abiertas"],"hh":["Instagram Stories","ManyChat","Notion o Airtable (pipeline)"]},{"id":"calendario-lanzamiento","t":"Calendario de lanzamiento","x":"Un calendario de cuarenta y cinco días con fecha de apertura y de cierre, y el contenido de cada día cargado.","e":"parcial","q":"Cuando el founder tiene un producto listo y ninguna fecha ni mecanica para venderlo.","ej":["demanda","venta"],"p":["Poner la fecha de apertura y de cierre en el calendario y avisarla al equipo.","Armar los primeros quince días de historia propia y calentamiento de audiencia.","Cargar el bloque de problema y después el de solución, con una pieza por día.","Definir la dinamica de activación: workshop o bootcamp en vivo dando valor, con registro de asistentes.","Dejar la parte comercial al final, con cupos, fecha de cierre y seña para reservar.","Correr el lanzamiento tal como está escrito y anotar cada día que trajo."],"cc":["Las fechas de apertura y cierre en el calendario","El calendario día por día con la pieza de cada uno","El registro de asistentes del workshop y de las manos levantadas"],"hh":["Notion (calendario de lanzamiento)","Instagram y WhatsApp para el tráfico","Google Meet o Zoom para el workshop"]},{"id":"capitalizar-evento","t":"Capitalizar un evento presencial","x":"El evento convertido en material publicado, base de datos de asistentes y conversaciones abiertas.","e":"parcial","q":"Cuando el founder da una charla, un taller o va a un evento y todo eso se termina el mismo día.","ej":["demanda","contenido"],"p":["Definir antes del evento qué se lleva: registro de asistentes, video de la charla y extractos.","Grabar la charla completa y subirla cruda al canal propio.","Sacar historias y un carrusel que lleven tráfico a ese video, el mismo día.","Al día siguiente publicar el posteo con los mensajes recibidos, repartiendo el link desde los comentarios.","Cargar a cada asistente en la base con de dónde vino y qué le interesa.","Abrir conversación con los que dejaron datos, dentro de las 48 horas."],"cc":["La hoja de qué se lleva del evento, hecha antes","La base de asistentes con origen e interes","El registro de conversaciones abiertas después del evento"],"hh":["YouTube para la charla completa","ManyChat para repartir el link","Notion o Airtable (base de asistentes)"]}]},{"c":"Comercial y ventas","porque":"Varios casos tienen oferta, audiencia y nada que lleve de la conversación a la plata, y las llamadas se caen siempre en el mismo lugar.","items":[{"id":"pipeline-7-campos","t":"Pipeline de siete campos","x":"Un pipeline único con todos los contactos cargados y una próxima acción con fecha en cada uno.","e":"existe","q":"Se le asigna a todo founder que ya tiene consultas entrando y las maneja de memoria.","ej":["venta","demanda"],"p":["Armar la base con los siete campos: contacto, fuente, etapa, objeción, presupuesto, próxima acción y fecha.","Volcar ahí todo lo que hay hoy: mensajes, Calendly, planillas sueltas y contactos viejos.","Definir las etapas con nombre propio, de primer contacto a cerrado.","Cargar cada conversación nueva el mismo día que pasa.","Revisar el pipeline una vez por semana y mover las próximas acciones vencidas.","Leer una vez por mes de dónde vino cada venta."],"cc":["La base de siete campos con todos los contactos cargados","Las etapas definidas con nombre propio","La revisión semanal agendada en el calendario"],"hh":["Notion o Airtable (pipeline)","Calendly","Google Sheets si arranca simple"]},{"id":"prospeccion-y-recontacto","t":"Recontacto de la base y prospección directa","x":"Veinte conversaciones nuevas por semana corriendo, entre base historica y contactos nuevos, con el registro de cada una.","e":"parcial","q":"Cuando el founder necesita ventas en sesenta días y el contenido solo no llega a tiempo.","ej":["venta","demanda"],"p":["Juntar la base historica: clientes viejos, presupuestos que no cerraron y contactos del Calendly.","Ordenar la base por cercanía: ya compró, pidió presupuesto, solo consulto.","Escribir el mensaje de recontacto con el caso documentado adelante, distinto para cada grupo.","Recontactar cinco personas por día de la base historica.","Armar la lista de cincuenta prospectos nuevos que entren en el ICP y contactar veinte por semana.","Cargar cada respuesta en el pipeline con objeción y próxima acción."],"cc":["La base historica ordenada por cercanía","Los mensajes de recontacto y de prospección escritos","El registro diario de contactos hechos y respuestas"],"hh":["Notion o Airtable (pipeline)","WhatsApp e Instagram para el contacto","Calendly para agendar"]},{"id":"llamada-de-venta","t":"La llamada de venta y el cierre","x":"Un guion de llamada propio, cinco llamadas grabadas con su objeción anotada y el mecanismo de cierre definido.","e":"parcial","q":"Cuando el founder abre bien las conversaciones y se le caen al final.","ej":["venta"],"p":["Escribir el guion en cuatro tramos: contexto, dolor, costo de no avanzar y propuesta con precio.","Definir el cierre: cupos limitados, fecha y seña para reservar el lugar.","Dejar el downsell fuera de la comunicación y ofrecerlo solo adentro de la llamada cuando el freno es el precio.","Grabar todas las llamadas y revisarlas con el mentor.","Anotar la objeción textual de cada llamada que no cerró.","Corregir el guion y el contenido con las objeciones que se repiten."],"cc":["El guion de llamada en cuatro tramos","Las grabaciones de las llamadas subidas donde el mentor las vea","La planilla de objeciones con la corrección aplicada"],"hh":["Google Meet o Zoom con grabación","Notion (guion y objeciones)","Link de pago para la seña"]},{"id":"propuesta-comercial","t":"Propuesta comercial con esqueleto fijo","x":"Una plantilla de propuesta propia y una propuesta real enviada con el precio nuevo.","e":"existe","q":"Cuando el founder arma cada presupuesto de cero y tarda días en mandarlo.","ej":["venta","oferta"],"p":["Armar el esqueleto fijo: portada, objetivos y modalidad, alcance con incluye y no incluye, fases, equipo e inversión.","Escribir el alcance con la aclaración de qué necesita del cliente para cumplirse.","Partir el trabajo en fases con el entregable de cada una.","Dejar la inversión en una sola lamina, con forma de pago.","Armar la propuesta desde las notas de la llamada de venta, sin inventar nada nuevo.","Mandarla dentro de las 48 horas de la llamada y registrar la respuesta."],"cc":["La plantilla de propuesta con el esqueleto fijo","El texto de alcance con incluye, no incluye y requisitos","La primera propuesta real enviada con el precio nuevo"],"hh":["Canva o Claude Design","Notion (plantilla de propuesta)"]},{"id":"setter-closer","t":"Sumar un setter o un closer","x":"Una persona incorporada con scope, guion y comisión escritos, y las primeras llamadas hechas con ella adentro.","e":"falta","q":"Cuando el volumen de conversaciones pasa lo que el founder puede atender solo, o cuando el cierre se le escapa siempre en el mismo lugar.","ej":["venta"],"p":["Separar las dos tareas: quién abre y filtra conversaciones, y quién cierra.","Decidir cuál de las dos suelta primero, mirando dónde se pierde más plata hoy.","Escribir el scope: qué hace, con qué guion, cuántas conversaciones por día y qué reporta.","Definir la compensación: fijo, comisión por cierre y cuando se paga.","Reclutar, entrevistar y hacer una prueba paga sobre conversaciones reales.","Correr las primeras diez llamadas escuchando las grabaciones y corrigiendo el guion."],"cc":["El scope del rol con guion y números de actividad","El esquema de comisión escrito","Las grabaciones de la prueba paga con la devolución hecha"],"hh":["Notion (scope y guion del rol)","Formulario de postulación","Pipeline en Notion o Airtable"]}]},{"c":"Entrega del servicio","porque":"Hay founders que venden bien y quedan sin sistema el día después de la venta, y ahí se les va el tiempo y la rentabilidad.","items":[{"id":"onboarding-y-roadmap-cliente","t":"Onboarding a 48 horas y roadmap para el cliente","x":"Un onboarding que corre dentro de las 48 horas de cada venta y un roadmap con hitos presentado al cliente.","e":"parcial","q":"Cuando la venta cae y a partir de ahí el founder improvisa.","ej":["entrega"],"p":["Escribir la secuencia de las primeras 48 horas: mensaje de bienvenida, accesos, formulario y reunión de arranque.","Armar el formulario de arranque con lo que hace falta saber antes de producir.","Armar la plantilla de roadmap con hitos, fechas y quién responde por cada uno.","Presentarle el roadmap al cliente en una reunión, no por mensaje.","Dejar el roadmap en un lugar donde el cliente lo vea y se actualice.","Aplicarlo a los clientes que ya están adentro y corregir lo que se rompa."],"cc":["La secuencia escrita de las primeras 48 horas","El formulario de arranque del cliente","El roadmap presentado a cada cliente activo"],"hh":["Notion (OS del cliente con el roadmap adentro)","Formulario de onboarding","WhatsApp o mail para la secuencia"]},{"id":"proceso-entrega-repetible","t":"Proceso de entrega que se repite igual","x":"El proceso de entrega escrito en un documento, con horas reales por etapa, aplicado a un cliente de prueba.","e":"parcial","q":"Cuando cada cliente se entrega distinto y todo depende de que el founder esté arriba.","ej":["entrega"],"p":["Mapear las entregas en curso: que se prometió, en qué estado está y que se resuelve sobre la marcha.","Medir las horas reales que lleva cada etapa, incluidas las propias.","Escribir el proceso paso por paso, con el entregable y el responsable de cada etapa.","Definir la capacidad: cuántos clientes entran con el equipo de hoy.","Aplicarlo a un cliente de prueba y corregir el documento con lo que se rompa.","Dejar el proceso donde el equipo lo use todos los días."],"cc":["El mapa de servicio con horas reales por etapa","El documento de proceso con responsables","El número de capacidad: cuántos clientes entran hoy"],"hh":["Noti function kEnvio(id,slug){return 'cf-env-'+id+'-'+(slug||'')}

}
function guardarEnvio(id,slug,v){
  try{ localStorage.setItem(kEnvio(id,slug),JSON.stringify(v)) }catch(e){}
}
function abrirEnvio(id){
  var caja=$('#env-'+id); if(!caja) return;

  var ops=C.slice().sort(function(a,b){return a.nombre.localeCompare(b.nombre)})
    .map(function(c){return '<option value="'+esc(c.slug)+'">'+esc(c.nombre)+'</option>'}).join('');
  caja.innerHTML=
    '<div class="eh">Preparar el envío</div>'+
    '<label><span>Para quién</span><select data-f="founder"><option value="">Elegí un founder</option>'+ops+'</select></label>'+
    '<div class="fila">'+
      '<label><span>Por qué le toca ahora</span><textarea data-f="porque" placeholder="Qué viste en su caso que hace que esta carta sea la que sigue."></textarea></label>'+
      '<label><span>El objetivo concreto</span><textarea data-f="objetivo" placeholder="Qué tiene que quedar hecho, con número y con fecha si corresponde."></textarea></label>'+
    '</div>'+
    '<label><span>Con qué cabeza encararla</span><textarea data-f="mindset" placeholder="El mindset con el que la tiene que agarrar: qué priorizar, qué soltar, qué esperar."></textarea></label>'+
    '<p class="nota">La carta del módulo se manda igual para todos. Esto se le suma adelante, escrito para él.</p>'+
    '<div class="acc"><button class="boton tinta" data-f="bajar">Descargar la carta<span class="fl"></span></button></div>'+
    '<p class="aviso" data-f="aviso" hidden></p>';
  caja.hidden=false;
  var sel=caja.querySelector('[data-f="founder"]');
  var campos=['porque','objetivo','mindset'];
  function cargar(){
    var v=leerEnvio(id,sel.value);
    campos.forEach(function(k){caja.querySelector('[data-f="'+k+'"]').value=v[k]||''});
  }
  sel.addEventListener('change',cargar);
  caja.addEventListener('input',function(e){
    if(!e.target.dataset.f||e.target.dataset.f==='founder')return;
    var v={}; campos.forEach(function(k){v[k]=caja.querySelector('[data-f="'+k+'"]').value});
    guardarEnvio(id,sel.value,v);});
  caja.querySelector('[data-f="bajar"]').addEventListener('click',function(){bajarCarta(id,caja,sel)});
  cargar();
}
function avisar(caja,txt,mal){
  var a=caja.querySelector('[data-f="aviso"]');
  a.textContent=txt; a.hidden=!txt; a.className='aviso'+(mal?' mal':'');
}
async function bajarCarta(id,caja,sel){
  var slug=sel.value;
  var nombre=slug?nombreDe(slug):'';
  var v={}; ['porque','objetivo','mindset'].forEach(function(k){v[k]=caja.querySelector('[data-f="'+k+'"]').value.trim()});
  var hay=v.porque||v.objetivo||v.mindset;
  avisar(caja,'Armando la carta…');
  var html;
  try{ var r=await fetch('cartas/'+id+'.html'); if(!r.ok) throw 0; html=await r.text(); }
  catch(e){ avisar(caja,'No pude leer la carta. Abrila con el botón de arriba y guardala desde el navegador.',true); return; }
  if(hay){
    var doc=new DOMParser().parseFromString(html,'text/html');
    var tpl=doc.querySelector('#tpl-bajada');
    if(tpl){
      var nodo=tpl.content.firstElementChild.cloneNode(true);
      nodo.querySelector('[data-b="titulo"]').textContent = nombre? ('Por qué esta carta, '+nombre.split(' ')[0]) : 'Por qué esta carta';
      var vivas=0;
      ['porque','objetivo','mindset'].forEach(function(k){
        var fila=nodo.querySelector('[data-b="fila-'+k+'"]');
        if(v[k]){ nodo.querySelector('[data-b="'+k+'"]').textContent=v[k]; vivas++; }
        else fila.remove();});
      nodo.querySelector('[data-b="grilla"]').style.gridTemplateColumns='repeat('+vivas+',minmax(0,1fr))';
      var deck=doc.querySelector('#deck')||doc.body;
      var primera=deck.querySelector('.slot');
      if(primera&&primera.nextSibling) deck.insertBefore(nodo,primera.nextSibling); else deck.appendChild(nodo);
      tpl.remove();
      if(nombre){ var t=doc.querySelector('title'); if(t) t.textContent=t.textContent+' · '+nombre; }
      html='<!doctype html>\n'+doc.documentElement.outerHTML;
    }
  }
  var arch='carta-'+id+(slug?'-'+slug:'')+'.html';
  var dl=null;
  try{ dl=await claude.use('downloads'); }catch(e){}
  if(!dl){ avisar(caja,'Acá no puedo bajarte el archivo. Abrí la carta con el botón de arriba y guardala desde el navegador.',true); return; }
  try{ await dl.save({filename:arch,data:html}); avisar(caja,'Listo, la carta quedó descargada como '+arch+'.'); }
  catch(e){
    var c=(e&&e.code)||'';
    avisar(caja, c==='declined' ? 'Cancelaste la descarga.' : 'No se pudo descargar la carta.', c!=='declined');
  }
}

/* ---------------- router ---------------- */
function ir(t,f){
  tab=t;
  if(t==='clientes'){filtro=(f&&f!=='todos')?f:null;vClientes();}
  document.querySelectorAll('.vista').forEach(function(v){v.classList.remove('on')});
  $('#v-'+t).classList.add('on');
  document.querySelectorAll('.riel nav button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.t===t))});
  $('#tmov').textContent=TIT[t]; document.body.classList.remove('detalle');
  window.scrollTo(0,0);
  if(location.hash.indexOf('#c/')===0) history.replaceState(null,'','#'+t); else location.hash='#'+t;
}
document.querySelectorAll('.riel nav button').forEach(function(b){
  b.addEventListener('click',function(){ir(b.dataset.t)})});

  });
})();
window.addEventListener('hashchange',function(){
  var hs=location.hash.slice(1);
  if(hs.indexOf('c/')===0){ if('#'+hs!==location.hash) return; abrir(hs.slice(2)); return; }
  if(document.body.classList.contains('detalle')) ir(TIT[hs]?hs:tab);});
/* teclado: flechas para moverse entre clientes, escape para volver */
document.addEventListener('keydown',function(e){
  if(!document.body.classList.contains('detalle')) return;
  var t=e.target.tagName; if(t==='INPUT'||t==='TEXTAREA') return;
  if(e.key==='ArrowRight'){e.preventDefault();saltar(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();saltar(-1)}
  else if(e.key==='Escape'){e.preventDefault();ir(tab)}});
