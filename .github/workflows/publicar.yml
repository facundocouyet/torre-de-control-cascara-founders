# Arma la torre y la publica en GitHub Pages en cada push a main.
# Nadie commitea HTML: lo genera acá y lo sube solo.
name: Publicar la torre

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# si se pushea dos veces seguidas, la segunda gana y la primera se cancela
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Armar el sitio
        run: |
          chmod +x construir.sh
          ./construir.sh
      - name: Revisar que la torre haya salido
        run: |
          test -f dist/index.html || { echo "no salio el index"; exit 1; }
          n=$(find dist/cartas -name '*.html' 2>/dev/null | wc -l)
          echo "cartas: $n"
          test "$n" -gt 30 || { echo "salieron muy pocas cartas"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
